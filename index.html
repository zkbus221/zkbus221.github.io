<script>
// Older iPhones/iPads get the edition built for them (add ?stay=1 to the address to stay on this one)
(function () {
  try {
    if (location.search.indexOf('stay=1') !== -1) { return; }
    var ua = navigator.userAgent, m = ua.match(/OS (\d+)_/);
    if (!m || !/iPhone|iPad|iPod/.test(ua)) { return; }
    var v = parseInt(m[1], 10);
    if (v <= 6) { location.replace('ios6/'); } else if (v <= 10) { location.replace('legacy/'); }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>

           -webkit-justify-content: center; justify-content: center; width: 34px; height: 34px; margin-right: 12px;
           border-radius: 17px; background: #0a84ff; }
  .rbody { -webkit-flex: 1; flex: 1; min-width: 0; }
  .rt { font-size: 17px; line-height: 22px; font-weight: 600; }

  .row.here { background: rgba(10,132,255,.12); }

  /* ----- map pins and the little departure card ----- */

  .stopico.sel { background: #ff3b30; color: #ff3b30; }
  .stopico svg { display: block; }
  .leaflet-popup-content-wrapper { padding: 0; border-radius: 14px; box-shadow: 0 3px 18px rgba(0,0,0,.3); }
  .leaflet-popup-content { margin: 12px 14px; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; line-height: 1.3; }
  .pop { min-width: 210px; }
  .pname { margin-bottom: 6px; font-size: 16px; line-height: 20px; font-weight: 700; }
  .prow { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 4px 0; }

  .plink { display: block; width: 100%; margin-top: 8px; padding: 9px 0; border: 0; border-radius: 9px; background: #0a84ff; color: #fff; font-size: 15px; font-weight: 600; }

  /* ----- landscape: the panel moves to the left ----- */
  body.land .sheet { left: 12px; left: calc(12px + constant(safe-area-inset-left)); left: calc(12px + env(safe-area-inset-left));
                     right: auto; width: 370px; max-width: 48%; margin: 0; }
  body.typing .ctrls, body.typing .area { display: none; }

  /* ----- dark ----- */
  .dark .sheet { background: rgba(30,30,32,.95); color: #fff; }

  .dark .pnote.err { color: #ff6961; }
</style>

<body>
<div id="map"></div>
<img class="logo" src="logo.png" width="44" height="44" alt="ZK’s London Bus Tracker">
<div id="mapWarn" class="warn" style="display:none">The map pictures could not load on this device. Stops, search and times still work.</div>

<div class="ctrls">
  <button id="locate" type="button" aria-label="Show my location">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3z" fill="currentColor"/></svg>
  </button>
</div>
<button id="areaBtn" class="area" type="button" style="display:none">Search this area</button>

<div id="sheet" class="sheet">
  <div id="head" class="head">
    <div class="grab"></div>
    <div class="searchrow">
      <div class="field">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <input id="q" type="text" placeholder="Search bus stops" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
        <button id="clear" class="clr" type="button" style="display:none" aria-label="Clear">&times;</button>
      </div>
      <button id="cancel" class="cancel" type="button" style="display:none">Cancel</button>
    </div>
  </div>
  <div id="content" class="content"></div>
</div>
<div id="probe" style="position:fixed;left:0;bottom:0;width:1px;height:0;visibility:hidden;padding-bottom:constant(safe-area-inset-bottom);padding-bottom:env(safe-area-inset-bottom);-webkit-box-sizing:content-box;box-sizing:content-box"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* Old-Safari friendly: ES5 only (var, function, XMLHttpRequest). */

/* ===== Settings you can change ===== */
var API_BASE = 'https://busproxy.zkbus221.workers.dev';   // <-- your Worker address
var REFRESH_MS = 20000;        // arrivals refresh (milliseconds)
var NEARBY_RADIUS = 400;       // metres
var TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';   // or API_BASE + '/tile/{z}/{x}/{y}.png' to go through your Worker
var MAX_DOTS = 40;
var MAX_RESULTS = 40;          // most stops listed for one search             // most stop pins drawn on the map
var START_VIEW = [51.5074, -0.1278];   // used if location is unavailable (central London)
var TOP_GAP = 56;              // map left visible above the sheet when fully open (px)
var PEEK = 88;                 // sheet height when collapsed (px)
var TOP_GAP_LAND = 12;         // same, when the phone is on its side (px)
/* =================================== */

var BUS_SVG = '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="3" width="16" height="15" rx="3" fill="#fff"/><rect x="6" y="5.5" width="12" height="5" rx="1" fill="currentColor"/><circle cx="8.5" cy="14.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="14.5" r="1.4" fill="currentColor"/><rect x="6" y="18" width="3" height="3" rx="1" fill="#fff"/><rect x="15" y="18" width="3" height="3" rx="1" fill="#fff"/></svg>';

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) { e.className = cls; }
  if (text !== undefined) { e.textContent = text; }
  return e;
}

var sheet = $('sheet'), head = $('head'), content = $('content'), q = $('q');
var map = null, nearbyLayer = null, selectedMarker = null, youMarker = null, attrib = null;
var isLand = false, isDark = false, typing = false, safeBottom = 0, kbHeight = 0;
var VIEW = 'home';             // 'home' | 'results' | 'stop'
var backView = 'home';
var currentStop = null, timer = null;
var homeItems = [], homeNote = '', homeLoading = false, stickyNote = '';
var lastResults = null, searchSeq = 0, searchTimer = null;
var recents = loadRecents();

/* ---------- network ---------- */

function getJSON(path, onOk, onFail, tries) {
  tries = tries || 0;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', API_BASE + path, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) { return; }
    if (xhr.status >= 200 && xhr.status < 300) {
      var data;
      try { data = JSON.parse(xhr.responseText); }
      catch (e) { onFail('Could not read the response from TfL.', 0); return; }
      onOk(data);
    } else if (xhr.status === 429) {
      if (tries < 2) {   // wait a moment and try again before giving up
        setTimeout(function () { getJSON(path, onOk, onFail, tries + 1); }, 2000 * (tries + 1));
        return;
      }
      onFail('TfL is limiting requests right now. Wait a few seconds and try again.', 429);
    } else if (xhr.status === 0) {
      onFail('Could not connect. Check your internet connection.', 0);
    } else {
      var detail = '';
      try { var j = JSON.parse(xhr.responseText); if (j && j.message) { detail = ' ' + String(j.message).slice(0, 140); } } catch (e) {}
      onFail('TfL did not accept that request (status ' + xhr.status + ').' + detail, xhr.status);
    }
  };
  xhr.send();
}

function toArray(x) { return Object.prototype.toString.call(x) === '[object Array]' ? x : [x]; }

function normalize(sp) {
  var towards = '', i, props = sp.additionalProperties || [];
  for (i = 0; i < props.length; i++) {
    if (props[i].key === 'Towards') { towards = props[i].value; }
  }
  var lines = [], ls = sp.lines || [];
  for (i = 0; i < ls.length; i++) { lines.push(ls[i].name); }
  return {
    id: sp.naptanId || sp.id,
    name: sp.commonName,
    label: sp.commonName + (sp.indicator ? ' (' + sp.indicator + ')' : ''),   // e.g. Golders Green Station (Stop A)
    lat: sp.lat, lon: sp.lon,
    towards: towards,
    letter: String(sp.stopLetter || sp.indicator || '').replace(/^stop\s+/i, '').toUpperCase(),
    distance: sp.distance || 0,
    lines: lines,
    detail: true
  };
}

// A search can return a whole station or interchange. Dig out the individual bus stops inside it.
function isBusStop(sp) {
  return sp.stopType === 'NaptanPublicBusCoachTfl' ||
         (sp.modes && String(sp.modes).indexOf('bus') !== -1 && !(sp.children && sp.children.length));
}
function leafStops(sp, out) {
  var kids = sp.children || [], i;
  if (kids.length) { for (i = 0; i < kids.length; i++) { leafStops(kids[i], out); } }
  else if (isBusStop(sp)) { out.push(sp); }
}

function distanceM(lat1, lon1, lat2, lon2) {
  var rad = Math.PI / 180, dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return Math.round(6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

// "Hill Rd" -> "Hill Road", for when a search finds nothing
function expandAbbrev(t) {
  var m = { rd: 'road', ave: 'avenue', av: 'avenue', ln: 'lane', gdns: 'gardens', gdn: 'garden', stn: 'station', pl: 'place', sq: 'square',
            cres: 'crescent', dr: 'drive', ct: 'court', pk: 'park', hosp: 'hospital', jct: 'junction', ter: 'terrace', gr: 'grove',
            cl: 'close', hse: 'house', sch: 'school', ctr: 'centre', ctre: 'centre', univ: 'university', rbt: 'roundabout' };
  var out = t.replace(/\b([A-Za-z]+)\.?(?=\s|$)/g, function (w, a) { return m[a.toLowerCase()] || w; });
  out = out.replace(/^st\.?\s/i, 'saint ').replace(/\sst\.?$/i, ' street');
  return out;
}

/* ---------- recents (search history) ---------- */

function loadRecents() {
  try {
    var r = JSON.parse(localStorage.getItem('busRecents') || '[]');
    return Object.prototype.toString.call(r) === '[object Array]' ? r : [];
  } catch (e) { return []; }
}
function saveRecents() {
  try { localStorage.setItem('busRecents', JSON.stringify(recents)); } catch (e) {}
}
function addRecent(item) {
  var out = [{ id: item.id, name: item.name, label: item.label, lat: item.lat, lon: item.lon, towards: item.towards, lines: item.lines || [] }];
  for (var i = 0; i < recents.length; i++) {
    if (recents[i].id !== item.id) { out.push(recents[i]); }
  }
  recents = out.slice(0, 8);
  saveRecents();
}

/* ---------- bottom sheet ---------- */

var SH = 0, positions = [0, 0, 0], state = 1, curPos = 0;
var drag = { on: false, mode: '', y0: 0, ys: 0, pos0: 0, ly: 0, lt: 0, vel: 0, st0: 0, moved: false };
var lastDragEnd = 0, dragMoved = false;

function applyPos(y, anim) {
  var t = anim ? '.32s cubic-bezier(.2,.8,.2,1)' : 'none';
  sheet.style.webkitTransition = anim ? '-webkit-transform ' + t : 'none';
  sheet.style.transition = anim ? 'transform ' + t : 'none';
  sheet.style.webkitTransform = 'translate3d(0,' + y + 'px,0)';
  sheet.style.transform = 'translate3d(0,' + y + 'px,0)';
  curPos = y;
}

function setState(i, anim) {
  state = i;
  applyPos(positions[i], anim !== false);
  content.style.overflowY = (i === 0) ? 'auto' : 'hidden';
  if (i !== 0) { content.scrollTop = 0; }
}

function updateClasses() {
  document.body.className = (isDark ? 'dark ' : '') + (isLand ? 'land ' : '') + (typing ? 'typing' : '');
}

function applyContentPad() { content.style.paddingBottom = (kbHeight + safeBottom) + 'px'; }

function layout() {
  var ih = window.innerHeight, iw = window.innerWidth;
  safeBottom = $('probe').offsetHeight || 0;
  isLand = iw > ih && iw >= 560;           // phone/tablet on its side, or a wide window
  updateClasses();
  SH = ih - (isLand ? TOP_GAP_LAND : TOP_GAP);
  sheet.style.height = SH + 'px';
  var med = isLand ? Math.max(200, Math.round(ih * 0.55)) : Math.max(300, Math.round(ih * 0.46));
  positions = [0, Math.max(0, SH - med), SH - (PEEK + safeBottom)];
  content.style.top = head.offsetHeight + 'px';
  applyContentPad();
  setState(state, false);
  if (map) { map.invalidateSize(); setAttribution(); }
}

function tapOK() { return !(dragMoved && Date.now() - lastDragEnd < 400); }

function startDrag(y, target) {
  drag.on = true;
  drag.mode = head.contains(target) ? 'sheet' : 'pending';
  drag.y0 = y; drag.ys = y; drag.pos0 = curPos; drag.ly = y; drag.lt = Date.now();
  drag.vel = 0; drag.moved = false; drag.st0 = content.scrollTop;
}

function moveDrag(y, e) {
  if (!drag.on) { return; }
  var dy = y - drag.y0;
  if (drag.mode === 'pending') {
    if (Math.abs(dy) < 5) { return; }
    if (state !== 0) { drag.mode = 'sheet'; }
    else if (dy > 0 && drag.st0 <= 0 && content.scrollTop <= 0) { drag.mode = 'sheet'; }
    else { drag.mode = 'scroll'; }
    if (drag.mode === 'sheet') { drag.y0 = y; drag.pos0 = curPos; }
  }
  if (drag.mode !== 'sheet') { return; }
  if (e && e.cancelable) { e.preventDefault(); }
  var now = Date.now(), dt = now - drag.lt;
  if (dt > 0) { drag.vel = (y - drag.ly) / dt; }
  drag.ly = y; drag.lt = now;
  if (Math.abs(y - drag.ys) > 6) { drag.moved = true; }
  var p = drag.pos0 + (y - drag.y0);
  p = Math.max(positions[0], Math.min(positions[2], p));
  applyPos(p, false);
}

function endDrag() {
  if (!drag.on) { return; }
  drag.on = false;
  if (drag.mode !== 'sheet') { dragMoved = false; return; }
  var proj = curPos + drag.vel * 220, best = 0, i;
  for (i = 1; i < positions.length; i++) {
    if (Math.abs(positions[i] - proj) < Math.abs(positions[best] - proj)) { best = i; }
  }
  dragMoved = drag.moved;
  lastDragEnd = Date.now();
  if (best !== 0) { q.blur(); }
  setState(best, true);
}

sheet.addEventListener('touchstart', function (e) {
  if (e.touches.length === 1) { startDrag(e.touches[0].clientY, e.target); }
}, false);
sheet.addEventListener('touchmove', function (e) {
  if (e.touches.length === 1) { moveDrag(e.touches[0].clientY, e); }
}, false);
sheet.addEventListener('touchend', endDrag, false);
sheet.addEventListener('touchcancel', endDrag, false);

/* mouse support, so you can test on a computer */
sheet.addEventListener('mousedown', function (e) {
  if (e.target.tagName === 'INPUT') { return; }
  startDrag(e.clientY, e.target);
  var mv = function (ev) { moveDrag(ev.clientY, ev); };
  var up = function () {
    document.removeEventListener('mousemove', mv, false);
    document.removeEventListener('mouseup', up, false);
    endDrag();
  };
  document.addEventListener('mousemove', mv, false);
  document.addEventListener('mouseup', up, false);
}, false);

/* ---------- map ---------- */

function initMap() {
  if (typeof L === 'undefined') { setMsgOnly('The map could not load, but search still works.'); return; }
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView(START_VIEW, 16);
  var tiles = L.tileLayer(TILE_URL, { maxZoom: 19 }).addTo(map);
  var tileOk = 0, tileBad = 0;
  tiles.on('tileload', function () { tileOk++; });
  tiles.on('tileerror', function () { tileBad++; });
  setTimeout(function () { if (!tileOk && tileBad) { $('mapWarn').style.display = 'block'; } }, 7000);   // tell the person if no map pictures arrive
  attrib = L.control.attribution({ prefix: false, position: isLand ? 'bottomright' : 'topleft' });
  attrib.addAttribution('&copy; OpenStreetMap contributors');
  attrib.addTo(map);
  nearbyLayer = L.layerGroup().addTo(map);
  map.on('dragend', function () { if (VIEW === 'home') { $('areaBtn').style.display = 'block'; } });
}

function setAttribution() { if (attrib) { attrib.setPosition(isLand ? 'bottomright' : 'topleft'); } }

function panelRight() { return sheet.getBoundingClientRect().right; }

// Put a place in the middle of the part of the map you can actually see
function centerAbove(lat, lon, zoom, idx) {
  if (!map) { return; }
  var p = map.project([lat, lon], zoom);
  if (isLand) { p.x -= panelRight() / 2; }
  else { p.y += (SH - positions[idx]) / 2; }
  map.setView(map.unproject(p, zoom), zoom);
}

function visibleCenter() {
  var z = map.getZoom();
  var p = map.project(map.getCenter(), z);
  if (isLand) { p.x += panelRight() / 2; }
  else { p.y -= (SH - positions[state]) / 2; }
  return map.unproject(p, z);
}

var STOP_ICON = null, STOP_ICON_SEL = null;

function stopIcons() {
  if (!STOP_ICON && typeof L !== 'undefined') {
    STOP_ICON = L.divIcon({ className: 'stopico', html: BUS_SVG, iconSize: [30, 30], iconAnchor: [15, 15] });
    STOP_ICON_SEL = L.divIcon({ className: 'stopico sel', html: BUS_SVG, iconSize: [30, 30], iconAnchor: [15, 15] });
  }
}

function drawDots(items) {
  if (!nearbyLayer) { return; }
  stopIcons();
  nearbyLayer.clearLayers();
  for (var i = 0; i < items.length && i < MAX_DOTS; i++) {
    (function (item) {
      if (item.lat === undefined) { return; }
      var m = L.marker([item.lat, item.lon], { icon: STOP_ICON, keyboard: false });
      var box = makePopupBox(item);
      m.bindPopup(box.el, { autoPan: false, closeButton: false, minWidth: 220, maxWidth: 280, offset: [0, -16] });
      m.on('popupopen', function (e) { m.setIcon(STOP_ICON_SEL); fillPopup(box, item, m); placePopup(e.popup); });
      m.on('popupclose', function () { m.setIcon(STOP_ICON); });
      m.addTo(nearbyLayer);
    })(items[i]);
  }
}

// The small card that appears when you tap a stop on the map: the next three buses
function makePopupBox(item) {
  var box = { el: el('div', 'pop'), body: null, seq: 0 };
  box.el.appendChild(el('div', 'pname', item.label));
  box.body = el('div', 'pnote', 'Loading departures\u2026');
  box.el.appendChild(box.body);
  var btn = el('button', 'plink', 'All departures'); btn.type = 'button';
  btn.onclick = function () { if (map) { map.closePopup(); } openStop(item, true); };
  box.el.appendChild(btn);
  return box;
}

function setPopupBody(box, node) {
  box.el.replaceChild(node, box.body);
  box.body = node;
}

function fillPopup(box, item, m) {
  var my = ++box.seq;
  setPopupBody(box, el('div', 'pnote', 'Loading departures\u2026'));
  getJSON('/StopPoint/' + encodeURIComponent(item.id) + '/Arrivals',
    function (data) {
      if (my !== box.seq) { return; }
      data.sort(function (a, b) { return a.timeToStation - b.timeToStation; });
      var n = Math.min(data.length, 3), i;
      if (!n) { setPopupBody(box, el('div', 'pnote', 'No buses due right now.')); }
      else {
        var list = el('div', 'plist');
        for (i = 0; i < n; i++) {
          var mins = Math.floor(data[i].timeToStation / 60);
          var row = el('div', 'prow');
          row.appendChild(el('span', 'pbadge', data[i].lineName));
          row.appendChild(el('span', 'pdest', data[i].destinationName || data[i].towards || ''));
          row.appendChild(el('span', 'pmin', mins < 1 ? 'Due' : mins + ' min'));
          list.appendChild(row);
        }
        setPopupBody(box, list);
      }
      refreshPopup(m);
    },
    function (msg) {
      if (my !== box.seq) { return; }
      setPopupBody(box, el('div', 'pnote err', msg));
      refreshPopup(m);
    });
}

function refreshPopup(m) {
  var pp = m.getPopup();
  if (pp && map && map.hasLayer(pp)) { pp.update(); placePopup(pp); }
}

// Nudge the map so the card is not hidden behind the sheet or the screen edge
function placePopup(pp) {
  var node = pp ? (pp.getElement ? pp.getElement() : pp._container) : null;
  if (!map || !node) { return; }
  if (state === 0) { setState(1, true); }
  var pt = map.latLngToContainerPoint(pp.getLatLng());
  var h = node.offsetHeight + 24, w = node.offsetWidth;
  var ih = window.innerHeight, iw = window.innerWidth, dx = 0, dy = 0;
  if (isLand) {
    var left = panelRight() + 10;
    if (pt.x - w / 2 < left) { dx = pt.x - w / 2 - left; }
    if (pt.x + w / 2 > iw - 10) { dx = pt.x + w / 2 - (iw - 10); }
    if (pt.y - h < 10) { dy = pt.y - h - 10; }
    if (pt.y > ih - 40) { dy = pt.y - (ih - 40); }
  } else {
    var bottom = ih - (SH - positions[state]) - 20;     // top edge of the sheet
    if (pt.y - h < 50) { dy = pt.y - h - 50; }
    if (pt.y > bottom) { dy = pt.y - bottom; }
    if (pt.x - w / 2 < 10) { dx = pt.x - w / 2 - 10; }
    if (pt.x + w / 2 > iw - 10) { dx = pt.x + w / 2 - (iw - 10); }
  }
  if (dx || dy) { map.panBy([dx, dy]); }
}

function setSelected(lat, lon) {
  removeSelected();
  if (!map || lat === undefined) { return; }
  stopIcons();
  selectedMarker = L.marker([lat, lon], { icon: STOP_ICON_SEL, zIndexOffset: 1000, interactive: false, clickable: false, keyboard: false }).addTo(map);
}
function removeSelected() {
  if (selectedMarker && map) { map.removeLayer(selectedMarker); }
  selectedMarker = null;
}

var nearbyCache = {};

function applyNearby(items) {
  homeItems = items; homeLoading = false;
  homeNote = items.length ? stickyNote : 'No bus stops within ' + NEARBY_RADIUS + ' m. Drag the map and try Search this area.';
  drawDots(items);
  if (VIEW === 'home') { renderHome(); }
}

var nearbyTry = 0;      // which way of asking TfL worked last time

function nearbyPaths(la, lo) {
  var base = '/StopPoint?lat=' + la + '&lon=' + lo + '&radius=' + NEARBY_RADIUS;
  var extra = '&modes=bus&returnLines=true&categories=Direction&useStopPointHierarchy=false';
  return [
    base + '&stopTypes=NaptanPublicBusCoachTram' + extra,
    base + '&stopTypes=NaptanPublicBusCoachTfl' + extra,
    base + '&stopTypes=NaptanPublicBusCoachTram',
    base + '&stopTypes=NaptanPublicBusCoachTfl',
    base + '&stopTypes=NaptanOnstreetBusCoachStopPair' + extra
  ];
}

function fetchNearby(la, lo, ok, fail) {
  var paths = nearbyPaths(la, lo), tried = 0, lastMsg = '';
  var attempt = function () {
    if (tried >= paths.length) { fail(lastMsg); return; }
    var idx = (nearbyTry + tried) % paths.length;
    getJSON(paths[idx],
      function (data) { nearbyTry = idx; ok(data); },
      function (msg, status) {
        lastMsg = msg;
        if (status === 400 || status === 404) { tried++; attempt(); } else { fail(msg); }
      });
  };
  attempt();
}

function loadNearby(lat, lon) {
  var lat0 = Number(lat), lon0 = Number(lon);
  var la = lat0.toFixed(3), lo = lon0.toFixed(3);   // TfL only uses three decimals, so repeat searches can reuse saved results
  var key = la + ',' + lo, hit = nearbyCache[key];
  if (hit && new Date().getTime() - hit.t < 300000) { applyNearby(hit.items); return; }
  homeLoading = true; homeNote = '';
  if (VIEW === 'home') { renderHome(); }
  fetchNearby(la, lo,
    function (data) {
      var stops = data.stopPoints || [], leaves = [], items = [], seen = {}, i, it;
      for (i = 0; i < stops.length; i++) { leafStops(stops[i], leaves); }
      for (i = 0; i < leaves.length; i++) {
        it = normalize(leaves[i]);
        if (!it.id || seen[it.id] || it.lat === undefined) { continue; }
        seen[it.id] = true;
        it.distance = distanceM(lat0, lon0, it.lat, it.lon);
        it.detail = !!(leaves[i].additionalProperties && leaves[i].additionalProperties.length);
        if (it.distance <= NEARBY_RADIUS + 150) { items.push(it); }
      }
      items.sort(function (a, b) { return a.distance - b.distance; });
      nearbyCache[key] = { t: new Date().getTime(), items: items };
      applyNearby(items);
    },
    function (msg) {
      homeLoading = false; homeNote = msg;
      if (VIEW === 'home') { renderHome(); }
    });
}

function locate(initial) {
  if (!navigator.geolocation) { fallbackStart('This device cannot share its location.'); return; }
  homeLoading = true; homeNote = 'Finding your location…';
  if (VIEW === 'home') { renderHome(); }
  navigator.geolocation.getCurrentPosition(
    function (pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      stickyNote = '';
      if (map) {
        centerAbove(lat, lon, 16, state);
        if (youMarker) { map.removeLayer(youMarker); }
        youMarker = L.circleMarker([lat, lon], { radius: 8, color: '#fff', weight: 3, fillColor: '#0a84ff', fillOpacity: 1 }).addTo(map);
      }
      loadNearby(lat, lon);
    },
    function () {
      fallbackStart(initial ? 'Showing central London. Tap the arrow to use your location.' : 'Could not get your location. Check that location access is allowed for this site.');
    },
    { timeout: 10000, maximumAge: 60000 }
  );
}

function fallbackStart(note) {
  var c = map ? visibleCenter() : { lat: START_VIEW[0], lng: START_VIEW[1] };
  stickyNote = note;
  loadNearby(c.lat, c.lng);
}

/* ---------- content rendering ---------- */

function clearContent() {
  while (content.firstChild) { content.removeChild(content.firstChild); }
  content.scrollTop = 0;
}
function endContent() { content.appendChild(el('div', 'spacer')); }

function setMsgOnly(text, isErr) {
  clearContent();
  content.appendChild(el('div', 'note' + (isErr ? ' err' : ''), text));
  endContent();
}

function stopRow(item, withDistance) {
  var li = el('li', 'row');
  var icon = el('div', 'sicon'); icon.innerHTML = BUS_SVG;
  var body = el('div', 'rbody');
  body.appendChild(el('div', 'rt', item.label));
  if (item.towards) { body.appendChild(el('div', 'rs', 'Towards ' + item.towards)); }
  if (item.lines && item.lines.length) {

  li.onclick = function () { if (tapOK()) { openStop(item, false); } };
  return li;
}

function stopCard(items, withDistance) {
  var ul = el('ul', 'card');
  for (var i = 0; i < items.length; i++) { ul.appendChild(stopRow(items[i], withDistance)); }
  return ul;
}

function leaveStop() {
  if (timer) { clearInterval(timer); timer = null; }
  if (busTimer) { clearInterval(busTimer); busTimer = null; }
  currentStop = null;
  removeSelected();
}

function renderHome() {
  leaveStop();
  VIEW = 'home';
  var keep = content.scrollTop;
  clearContent();
  var h = el('div', 'sechead'); h.appendChild(el('h2', '', 'Nearby')); content.appendChild(h);
  if (homeLoading && !homeItems.length) { content.appendChild(el('div', 'note', homeNote || 'Finding stops…')); }
  else {
    if (homeNote) { content.appendChild(el('div', 'note', homeNote)); }
    if (homeItems.length) { content.appendChild(stopCard(homeItems.slice(0, 10), true)); }
  }
  if (recents.length) {
    var rh = el('div', 'sechead'); rh.appendChild(el('h2', '', 'Recents'));
    var clr = el('button', 'link', 'Clear'); clr.type = 'button';
    clr.onclick = function () { recents = []; saveRecents(); renderHome(); };
    rh.appendChild(clr); content.appendChild(rh);
    content.appendChild(stopCard(recents, false));
  }
  endContent();
  content.scrollTop = keep;
}

function renderResults() {
  leaveStop();
  VIEW = 'results';
  clearContent();
  var r = lastResults;
  if (!r || !r.items.length) {
    content.appendChild(el('div', 'note', 'No bus stops found' + (r ? ' for \u201C' + r.q + '\u201D' : '') + '.'));
  } else {
    if (r.items.length >= MAX_RESULTS) {
      content.appendChild(el('div', 'note', 'Showing the first ' + MAX_RESULTS + ' stops. Add the stop letter to narrow it down, for example \u201C' + r.q.replace(/\s+stop\s+\w+$/i, '') + ' stop D\u201D.'));
    }
    content.appendChild(stopCard(r.items, false));
  }
  endContent();
}

/* ---------- search ---------- */

var searchCache = {};

function searchItems(arr) {
  var leaves = [], items = [], seen = {}, i, it;
  for (i = 0; i < arr.length; i++) { if (arr[i]) { leafStops(arr[i], leaves); } }
  for (i = 0; i < leaves.length; i++) {
    it = normalize(leaves[i]);
    if (!it.id || seen[it.id]) { continue; }
    seen[it.id] = true;
    it.detail = !!(leaves[i].additionalProperties && leaves[i].additionalProperties.length);   // children often lack "Towards"
    items.push(it);
  }
  return items;
}

function doSearch(text) {
  var key = text.toLowerCase();
  var my = ++searchSeq;
  if (searchCache[key]) { finishSearch(searchCache[key], text); return; }
  setMsgOnly('Searching\u2026');

  var name = text, letter = '', lm = text.match(/^(.*\S)\s+stop\s+([a-z0-9]{1,2})$/i);   // "king's cross stop d"
  if (lm) { name = lm[1]; letter = lm[2].toUpperCase(); }

  var byName = function (nm, last) {
    getJSON('/StopPoint/Search?query=' + encodeURIComponent(nm) + '&modes=bus&maxResults=' + MAX_RESULTS,
      function (data) {
        if (my !== searchSeq) { return; }
        var ms = data.matches || [], ids = [], seen = {}, basics = [], i;
        for (i = 0; i < ms.length; i++) {
          if (seen[ms[i].id]) { continue; }
          seen[ms[i].id] = true; ids.push(encodeURIComponent(ms[i].id));
          basics.push({ id: ms[i].id, name: ms[i].name, label: ms[i].name, lat: ms[i].lat, lon: ms[i].lon, towards: '', distance: 0, lines: [], detail: false });
        }
        if (!ids.length) {
          var alt = last ? '' : expandAbbrev(nm);
          if (alt && alt.toLowerCase() !== nm.toLowerCase()) { byName(alt, true); return; }
          finishSearch([], text); return;
        }
        getJSON('/StopPoint/' + ids.join(','),
          function (res) {
            if (my !== searchSeq) { return; }
            var items = searchItems(toArray(res)), k, f = [];
            if (letter) {
              for (k = 0; k < items.length; k++) { if (items[k].letter === letter) { f.push(items[k]); } }
              if (f.length) { items = f; }
            }
            items = items.slice(0, MAX_RESULTS);
            if (items.length) { searchCache[key] = items; }
            finishSearch(items.length ? items : basics, text);
          },
          function () { if (my === searchSeq) { finishSearch(basics, text); } });
      },
      function (msg) { if (my === searchSeq) { setMsgOnly(msg, true); } });
  };

  if (/^\d{5}$/.test(text)) {          // a five-digit stop code, as printed on the bus stop sign
    getJSON('/StopPoint/Sms/' + text,
      function (res) {
        if (my !== searchSeq) { return; }
        var items = searchItems(toArray(res));
        if (items.length) { searchCache[key] = items; finishSearch(items, text); } else { byName(name); }
      },
      function () { if (my === searchSeq) { byName(name); } });
  } else { byName(name); }
}

function finishSearch(items, text) {
  lastResults = { items: items, q: text };
  renderResults();
}

q.addEventListener('focus', function () {
  $('cancel').style.display = 'block';
  typing = true; updateClasses();
  if (state !== 0) { setState(0, true); }
}, false);
q.addEventListener('blur', function () { typing = false; updateClasses(); }, false);
// Open the sheet fully BEFORE the keyboard appears, so Safari does not scroll the page to find the search box
function openFullForTyping() { if (state !== 0) { setState(0, false); } }
q.addEventListener('touchstart', openFullForTyping, false);
q.addEventListener('mousedown', openFullForTyping, false);
q.addEventListener('input', function () {
  var v = q.value.replace(/^\s+|\s+$/g, '');
  $('clear').style.display = q.value ? 'block' : 'none';
  if (searchTimer) { clearTimeout(searchTimer); }
  if (v.length < 3) { searchSeq++; renderHome(); return; }
  searchTimer = setTimeout(function () { doSearch(v); }, 600);
}, false);
q.addEventListener('keydown', function (e) {
  e = e || window.event;
  if (e.keyCode === 13) {
    var v = q.value.replace(/^\s+|\s+$/g, '');
    if (searchTimer) { clearTimeout(searchTimer); }
    if (v.length >= 2) { doSearch(v); }
    q.blur();
  }
}, false);
$('clear').onclick = function () { q.value = ''; $('clear').style.display = 'none'; searchSeq++; renderHome(); q.focus(); };
$('cancel').onclick = function () {
  q.value = ''; q.blur(); searchSeq++;
  $('clear').style.display = 'none'; $('cancel').style.display = 'none';
  renderHome(); setState(1, true);
};

/* ---------- vehicle details (operator, fleet number, registration) ---------- */

function loadVeh() {
  try {
    var v = JSON.parse(localStorage.getItem('busVeh') || '{}');
    return (v && typeof v === 'object') ? v : {};
  } catch (e) { return {}; }
}
function saveVeh() {
  try {
    var n = 0, k;
    for (k in vehMem) { if (vehMem.hasOwnProperty(k)) { n++; } }
    if (n > 400) { vehMem = {}; }
    localStorage.setItem('busVeh', JSON.stringify(vehMem));
  } catch (e) {}
}
var vehMem = loadVeh();       // saved on this device so each bus is only looked up once
var vehQueue = [], vehBusy = 0, vehPending = {};

function prettyReg(r) { return /^[A-Z]{2}[0-9]{2}[A-Z]{3}$/.test(r) ? r.slice(0, 4) + ' ' + r.slice(4) : r; }

function lookupVehicle(reg, cb) {
  var c = vehMem[reg], now = new Date().getTime();
  if (c && now - c.t < (c.ok ? 7 * 86400000 : 86400000)) { cb(c); return; }
  if (vehPending[reg]) { vehPending[reg].push(cb); return; }
  vehPending[reg] = [cb];
  vehQueue.push(reg);
  pumpVeh();
}

function finishVeh(reg, rec) {
  vehBusy--;
  var cbs = vehPending[reg] || [];
  delete vehPending[reg];
  for (var i = 0; i < cbs.length; i++) { cbs[i](rec); }
  pumpVeh();
}

function pumpVeh() {
  while (vehBusy < 2 && vehQueue.length) {
    (function (reg) {
      vehBusy++;
      getJSON('/vehicle/' + encodeURIComponent(reg),
        function (d) {
          var rec = { ok: !!d.found, op: d.operator || '', fleet: d.fleet || '', type: d.type || '', t: new Date().getTime() };
          if (!d.error) { vehMem[reg] = rec; saveVeh(); }
          finishVeh(reg, rec);
        },
        function () { finishVeh(reg, { ok: false, op: '', fleet: '', type: '', t: 0 }); });
    })(vehQueue.shift());
  }
}

/* ---------- timetable (shown when no buses are due) ---------- */

var DAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
var schedEl = null;

function clearNode(e) { while (e.firstChild) { e.removeChild(e.firstChild); } }
function fmtTime(min) { return two(Math.floor(min / 60) % 24) + ':' + two(min % 60); }
function hmMin(o) { return parseInt(o.hour, 10) * 60 + parseInt(o.minute, 10); }

// Does a schedule called e.g. "Monday - Friday" or "Saturday" run on weekday number dow (0 = Sunday)?
function scheduleRunsOn(name, dow) {
  var n = String(name || '').toLowerCase(), found = [], i, at, k, d;
  if (n.indexOf('holiday') !== -1) { return false; }
  for (i = 0; i < 7; i++) {
    at = n.indexOf(DAY_NAMES[i]);
    if (at === -1) { at = n.indexOf(DAY_NAMES[i].slice(0, 3)); }
    if (at !== -1) { found.push({ d: i, at: at }); }
  }
  if (!found.length) { return /daily|every day|all days|7 days/.test(n); }
  found.sort(function (a, b) { return a.at - b.at; });
  if (found.length === 2 && /-|\bto\b|\u2013/.test(n.slice(found[0].at, found[1].at))) {   // a range, such as Monday - Friday
    d = found[0].d;
    for (k = 0; k < 7; k++) {
      if (d === dow) { return true; }
      if (d === found[1].d) { break; }
      d = (d + 1) % 7;
    }
    return false;
  }
  for (i = 0; i < found.length; i++) { if (found[i].d === dow) { return true; } }
  return false;
}

// Work out the next scheduled times from the saved timetables
function buildSchedule(tts) {
  var now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes(), dow = now.getDay();
  var times = [], freqAll = [], seen = {}, withTimes = {}, t, r, s, o, j, p;
  for (t = 0; t < tts.length; t++) {
    var tt = tts[t].tt, line = tts[t].line;
    var routes = (tt && tt.timetable && tt.timetable.routes) || [];
    for (r = 0; r < routes.length; r++) {
      var scheds = routes[r].schedules || [];
      for (s = 0; s < scheds.length; s++) {
        var sc = scheds[s];
        for (o = -1; o <= 1; o++) {                       // yesterday, today, tomorrow
          if (!scheduleRunsOn(sc.name, (dow + o + 7) % 7)) { continue; }
          var jn = sc.knownJourneys || [];
          for (j = 0; j < jn.length; j++) {
            var m = hmMin(jn[j]), abs = o * 1440 + m, key = line + '|' + abs;
            if (isNaN(m) || abs <= nowMin || seen[key]) { continue; }
            seen[key] = true; withTimes[line] = true;
            times.push({ abs: abs, line: line });
          }
          if (o === 0) {                                   // services that run "every X minutes"
            var ps = sc.periods || [];
            for (p = 0; p < ps.length; p++) {
              if (!ps[p].frequency || !ps[p].fromTime || !ps[p].toTime) { continue; }
              var from = hmMin(ps[p].fromTime), to = hmMin(ps[p].toTime);
              if (to < from) { to += 1440; }
              if (!isNaN(from) && !isNaN(to) && to > nowMin) {
                freqAll.push({ line: line, from: from, to: to, lo: ps[p].frequency.lowestFrequency, hi: ps[p].frequency.highestFrequency });
              }
            }
          }
        }
      }
    }
  }
  times.sort(function (a, b) { return a.abs - b.abs; });
  freqAll.sort(function (a, b) { return a.from - b.from; });
  var freqs = [], done = {};
  for (j = 0; j < freqAll.length; j++) {
    if (!done[freqAll[j].line] && !withTimes[freqAll[j].line]) { done[freqAll[j].line] = true; freqs.push(freqAll[j]); }
  }
  return { times: times.slice(0, 10), freqs: freqs };
}

function showSchedule(item) {
  if (currentStop !== item || !schedEl) { return; }
  var res = buildSchedule(item.ttRaw), i, li, body, ul;
  clearNode(schedEl);
  schedEl.style.display = 'block';
  schedEl.appendChild(el('div', 'stitle', 'Scheduled departures'));
  if (!res.times.length && !res.freqs.length) {
    schedEl.appendChild(el('div', 'note', 'No more scheduled departures found for this stop today.'));
    return;
  }
  schedEl.appendChild(el('div', 'snote', 'From the timetable, not live tracking.'));
  if (res.times.length) {
    ul = el('ul', 'card');
    for (i = 0; i < res.times.length; i++) {
      li = el('li', 'row arr srow');
      li.appendChild(el('div', 'badge', res.times[i].line));
      body = el('div', 'rbody');
      body.appendChild(el('div', 'rt', fmtTime(res.times[i].abs % 1440)));
      if (res.times[i].abs >= 1440) { body.appendChild(el('div', 'rs', 'Tomorrow')); }
      li.appendChild(body);
      ul.appendChild(li);
    }
    schedEl.appendChild(ul);
  }
  if (res.freqs.length) {
    ul = el('ul', 'card'); ul.style.marginTop = '10px';
    for (i = 0; i < res.freqs.length; i++) {
      var f = res.freqs[i];
      li = el('li', 'row arr');
      li.appendChild(el('div', 'badge', f.line));
      body = el('div', 'rbody');
      body.appendChild(el('div', 'rt', 'Every ' + ((f.lo === f.hi || f.hi === undefined) ? f.lo : f.lo + '\u2013' + f.hi) + ' min'));
      body.appendChild(el('div', 'rs', fmtTime(f.from) + ' to ' + fmtTime(f.to)));
      li.appendChild(body);
      ul.appendChild(li);
    }
    schedEl.appendChild(ul);
  }
}

function ensureLines(item, cb) {
  if (item.lines && item.lines.length) { cb(); return; }
  getJSON('/StopPoint/' + encodeURIComponent(item.id),
    function (res) {
      var sp = toArray(res)[0];
      if (sp && sp.commonName) { item.lines = normalize(sp).lines; }
      cb();
    },
    function () { cb(); });
}

function scheduleNote(text) {
  clearNode(schedEl);
  schedEl.style.display = 'block';
  schedEl.appendChild(el('div', 'stitle', 'Scheduled departures'));
  schedEl.appendChild(el('div', 'note', text));
}

function loadSchedule(item) {
  if (!schedEl) { return; }
  if (item.ttRaw) { showSchedule(item); return; }
  if (item.schedBusy) { return; }
  if (item.schedFail && new Date().getTime() - item.schedFail < 600000) { scheduleNote('No timetable is available for this stop.'); return; }
  item.schedBusy = true;
  scheduleNote('Looking up the timetable\u2026');
  ensureLines(item, function () {
    var names = (item.lines || []).slice(0, 8), pending = names.length, got = [];
    var finish = function () {
      item.schedBusy = false;
      if (got.length) { item.ttRaw = got; } else { item.schedFail = new Date().getTime(); }
      if (currentStop !== item) { return; }
      if (got.length) { showSchedule(item); } else { scheduleNote('No timetable is available for this stop.'); }
    };
    if (!pending) { finish(); return; }
    for (var i = 0; i < names.length; i++) {
      (function (name) {
        getJSON('/Line/' + encodeURIComponent(name.toLowerCase()) + '/Timetable/' + encodeURIComponent(item.id),
          function (tt) { got.push({ line: name, tt: tt }); pending--; if (!pending) { finish(); } },
          function () { pending--; if (!pending) { finish(); } });
      })(names[i]);
    }
  });
}

/* ---------- stop view ---------- */

var arrListEl = null, updEl = null, titleEl = null, subEl = null;
var busTimer = null, busCtx = null;

function openStop(item, fromMap, keepBack) {
  if (VIEW !== 'stop' && !keepBack) { backView = VIEW; }
  leaveStop();
  VIEW = 'stop';
  currentStop = item;
  addRecent(item);
  if (map) { map.closePopup(); }
  q.blur(); q.value = '';
  $('clear').style.display = 'none'; $('cancel').style.display = 'none';
  $('areaBtn').style.display = 'none';

  clearContent();
  var th = el('div', 'thead'), tt = el('div', 'tt');
  titleEl = el('h1', 'tname', item.label);
  subEl = el('div', 'tsub', item.towards ? 'Towards ' + item.towards : '');
  subEl.style.display = item.towards ? 'block' : 'none';
  tt.appendChild(titleEl); tt.appendChild(subEl);
  var x = el('button', 'xbtn', '\u00D7'); x.type = 'button'; x.setAttribute('aria-label', 'Close');
  x.onclick = function () { closeStop(); };
  th.appendChild(tt); th.appendChild(x); content.appendChild(th);
  arrListEl = el('ul', 'card'); arrListEl.style.display = 'none';
  content.appendChild(el('div', 'note', 'Loading arrivals\u2026')).id = 'arrNote';
  content.appendChild(arrListEl);
  schedEl = el('div', 'sched'); schedEl.style.display = 'none'; content.appendChild(schedEl);
  updEl = el('div', 'upd'); content.appendChild(updEl);
  endContent();

  setState(1, true);
  setSelected(item.lat, item.lon);
  if (map && item.lat !== undefined) {
    centerAbove(item.lat, item.lon, Math.max(map.getZoom(), 16), 1);
    if (!fromMap) { loadNearby(item.lat, item.lon); }
  }
  if (!item.detail) { fetchDetail(item); }   // adds the stop letter if the search result did not have it
  loadArrivals();
  timer = setInterval(loadArrivals, REFRESH_MS);
}

function fetchDetail(item) {
  getJSON('/StopPoint/' + encodeURIComponent(item.id), function (res) {
    var sp = toArray(res)[0];
    if (!sp || !sp.commonName) { return; }
    var d = normalize(sp);
    item.label = d.label; item.towards = d.towards || item.towards; item.lines = d.lines; item.detail = true;
    if (item.lat === undefined) { item.lat = d.lat; item.lon = d.lon; }
    var leaves = [], li;
    leafStops(sp, leaves);
    if (sp.children && sp.children.length && leaves.length) {      // this is a whole station: watch every stop inside it
      item.kids = [];
      for (li = 0; li < leaves.length; li++) { var kd = normalize(leaves[li]); item.kids.push({ id: kd.id, letter: kd.letter }); }
      if (currentStop === item) { loadArrivals(); }
    }
    addRecent(item);
    if (currentStop === item && titleEl) {
      titleEl.textContent = item.label;
      if (item.towards) { subEl.textContent = 'Towards ' + item.towards; subEl.style.display = 'block'; }
    }
  }, function () {});
}

function closeStop() {
  if (backView === 'results' && lastResults) { renderResults(); } else { renderHome(); }
}

function arrivalsFailed(mine, msg) {
  if (currentStop !== mine) { return; }
  var n = $('arrNote'); if (n) { n.style.display = 'block'; n.textContent = msg; n.className = 'note err'; }
}

// Whole station: ask each stop inside it and combine the answers
function arrivalsForKids(mine, ok, fail) {
  var kids = mine.kids.slice(0, 12), pending = kids.length, all = [], bad = 0;
  var one = function (kid) {
    getJSON('/StopPoint/' + encodeURIComponent(kid.id) + '/Arrivals',
      function (d) {
        for (var i = 0; i < d.length; i++) { if (!d[i].platformName || d[i].platformName === 'null') { d[i].platformName = kid.letter; } all.push(d[i]); }
        if (--pending === 0) { ok(all); }
      },
      function () { bad++; if (--pending === 0) { if (bad === kids.length) { fail('Could not reach TfL.'); } else { ok(all); } } });
  };
  for (var i = 0; i < kids.length; i++) { one(kids[i]); }
}

// If a stop says nothing, ask by route instead
function arrivalsByLine(mine, ok) {
  ensureLines(mine, function () {
    var names = (mine.lines || []).slice(0, 10), ids = [], i;
    if (!names.length) { ok([]); return; }
    for (i = 0; i < names.length; i++) { ids.push(encodeURIComponent(names[i].toLowerCase())); }
    getJSON('/Line/' + ids.join(',') + '/Arrivals/' + encodeURIComponent(mine.id),
      function (d) { ok(Object.prototype.toString.call(d) === '[object Array]' ? d : []); },
      function () { ok([]); });
  });
}

function loadArrivals() {
  if (!currentStop || document.hidden) { return; }
  var mine = currentStop;
  var show = function (data) { if (currentStop === mine) { renderArrivals(data); } };
  var fail = function (msg) { arrivalsFailed(mine, msg); };
  if (mine.kids && mine.kids.length) { arrivalsForKids(mine, show, fail); return; }
  getJSON('/StopPoint/' + encodeURIComponent(mine.id) + '/Arrivals',
    function (data) {
      if (data.length) { show(data); } else { arrivalsByLine(mine, show); }
    },
    fail);
}

function two(n) { return ('0' + n).slice(-2); }

function fillVeh(reg, fleetEl) {
  lookupVehicle(reg, function (rec) {
    if (rec.ok) { fleetEl.textContent = rec.fleet; }
  });
}

function renderArrivals(data) {
  var note = $('arrNote');
  while (arrListEl.firstChild) { arrListEl.removeChild(arrListEl.firstChild); }
  data.sort(function (a, b) { return a.timeToStation - b.timeToStation; });
  if (!data.length) {
    arrListEl.style.display = 'none';
    if (note) { note.style.display = 'block'; note.textContent = 'No buses due at this stop right now.'; note.className = 'note'; }
    if (currentStop) { loadSchedule(currentStop); }
  } else {
    if (schedEl) { schedEl.style.display = 'none'; }
    if (note) { note.style.display = 'none'; }
    var now = new Date().getTime();
    for (var i = 0; i < data.length; i++) {
      var a = data[i], mins = Math.floor(a.timeToStation / 60);
      var when = new Date(now + a.timeToStation * 1000);
      var li = el('li', 'row arr');
      if (a.vehicleId) { li.onclick = (function (arrival, stopItem) { return function () { if (tapOK()) { openBus(arrival, stopItem); } }; })(a, currentStop); }
      li.appendChild(el('div', 'badge', a.lineName));
      var mid = el('div', 'rbody');
      mid.appendChild(el('div', 'rt', a.destinationName || a.towards || ''));
      if (currentStop && currentStop.kids && currentStop.kids.length && a.platformName) { mid.appendChild(el('div', 'rs', 'Stop ' + a.platformName)); }
      var reg = String(a.vehicleId || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (i < 8 && reg.length >= 2 && reg.length <= 8) {
        var veh = el('div', 'veh');
        var fleetEl = el('span', 'vfleet');
        veh.appendChild(fleetEl); veh.appendChild(el('span', 'plate', prettyReg(reg)));
        mid.appendChild(veh);
        fillVeh(reg, fleetEl);
      }
      li.appendChild(mid);
      var col = el('div', 'mcol');
      col.appendChild(el('div', 'mins', mins < 1 ? 'Due' : mins + ' min'));
      col.appendChild(el('div', 'clock', two(when.getHours()) + ':' + two(when.getMinutes())));
      li.appendChild(col);
      arrListEl.appendChild(li);
    }
    arrListEl.style.display = 'block';
  }
  var d = new Date();
  updEl.textContent = 'Updated ' + two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()) +
                      '. Refreshes every ' + (REFRESH_MS / 1000) + ' seconds. Fleet details from bustimes.org.';
}

/* ---------- one bus: its next stops and when it gets there ---------- */

function closeBus() {
  var item = busCtx ? busCtx.item : null;
  if (busTimer) { clearInterval(busTimer); busTimer = null; }
  busCtx = null;
  if (item) { openStop(item, true, true); } else { renderHome(); }
}

function openBus(arrival, item) {
  leaveStop();
  VIEW = 'bus';
  busCtx = { arr: arrival, item: item };
  if (map) { map.closePopup(); }
  clearContent();
  var th = el('div', 'thead'), tt = el('div', 'tt');
  tt.appendChild(el('h1', 'tname', arrival.lineName + ' to ' + (arrival.destinationName || arrival.towards || '')));
  var reg = String(arrival.vehicleId || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (reg.length >= 2 && reg.length <= 8) {
    var veh = el('div', 'veh'), fleetEl = el('span', 'vfleet');
    veh.appendChild(fleetEl); veh.appendChild(el('span', 'plate', prettyReg(reg)));
    tt.appendChild(veh);
    fillVeh(reg, fleetEl);
  }
  var x = el('button', 'xbtn', '\u00D7'); x.type = 'button'; x.setAttribute('aria-label', 'Back');
  x.onclick = function () { closeBus(); };
  th.appendChild(tt); th.appendChild(x); content.appendChild(th);
  content.appendChild(el('div', 'stitle', 'Next stops')).id = 'busHead';
  content.appendChild(el('div', 'note', 'Loading predictions\u2026')).id = 'busNote';
  var ul = el('ul', 'card'); ul.id = 'busList'; ul.style.display = 'none'; content.appendChild(ul);
  var upd = el('div', 'upd'); upd.id = 'busUpd'; content.appendChild(upd);
  endContent();
  setState(1, true);
  loadBus();
  busTimer = setInterval(loadBus, 20000);
}

function loadBus() {
  var ctx = busCtx;
  if (!ctx || document.hidden) { return; }
  getJSON('/Vehicle/' + encodeURIComponent(ctx.arr.vehicleId) + '/Arrivals',
    function (data) { if (busCtx === ctx) { renderBus(toArray(data), ctx); } },
    function (msg) {
      if (busCtx !== ctx) { return; }
      var n = $('busNote'); if (n) { n.style.display = 'block'; n.textContent = msg; n.className = 'note err'; }
    });
}

function renderBus(data, ctx) {
  var ul = $('busList'), note = $('busNote'), upd = $('busUpd');
  if (!ul) { return; }
  clearNode(ul);
  data = data.filter(function (d) { return d && d.timeToStation !== undefined; });
  data.sort(function (a, b) { return a.timeToStation - b.timeToStation; });
  if (!data.length) {
    ul.style.display = 'none';
    if (note) { note.style.display = 'block'; note.className = 'note'; note.textContent = 'No predictions for this bus right now. It may have finished its journey or not started yet.'; }
  } else {
    if (note) { note.style.display = 'none'; }
    var now = new Date().getTime(), n = Math.min(data.length, 30), i;
    for (i = 0; i < n; i++) {
      var d = data[i], mins = Math.floor(d.timeToStation / 60), when = new Date(now + d.timeToStation * 1000);
      var stopName = (d.stationName || 'Bus stop') + ((d.platformName && d.platformName !== 'null') ? ' (Stop ' + String(d.platformName).replace(/^stop\s+/i, '') + ')' : '');
      var li = el('li', 'row arr' + ((ctx.item && d.naptanId === ctx.item.id) ? ' here' : ''));
      var mid = el('div', 'rbody');
      mid.appendChild(el('div', 'rt', stopName));
      if (ctx.item && d.naptanId === ctx.item.id) { mid.appendChild(el('div', 'rs', 'The stop you are looking at')); }
      li.appendChild(mid);
      var col = el('div', 'mcol');
      col.appendChild(el('div', 'mins', mins < 1 ? 'Due' : mins + ' min'));
      col.appendChild(el('div', 'clock', two(when.getHours()) + ':' + two(when.getMinutes())));
      li.appendChild(col);
      ul.appendChild(li);
    }
    ul.style.display = 'block';
  }
  var t = new Date();
  upd.textContent = 'Predicted times, updated ' + two(t.getHours()) + ':' + two(t.getMinutes()) + ':' + two(t.getSeconds()) + '.';
}

/* ---------- buttons, theme, start ---------- */

$('locate').onclick = function () {
  if (VIEW !== 'home') { renderHome(); }
  $('areaBtn').style.display = 'none';
  locate(false);
};
$('mapWarn').onclick = function () { $('mapWarn').style.display = 'none'; };
$('areaBtn').onclick = function () {
  $('areaBtn').style.display = 'none';
  if (!map) { return; }
  stickyNote = '';
  var c = visibleCenter();
  loadNearby(c.lat, c.lng);
};

function applyTheme() {
  isDark = false;
  if (window.matchMedia) { isDark = window.matchMedia('(prefers-color-scheme: dark)').matches; }
  updateClasses();
}
if (window.matchMedia) {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addListener) { mq.addListener(applyTheme); }
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && currentStop) { loadArrivals(); } }, false);
window.addEventListener('resize', layout, false);
window.addEventListener('orientationchange', function () {
  setTimeout(function () {
    layout();
    if (map && currentStop && currentStop.lat !== undefined) {
      centerAbove(currentStop.lat, currentStop.lon, map.getZoom(), state === 0 ? 1 : state);
    }
  }, 300);
}, false);
if (window.visualViewport) {            // keep the last search result reachable above the keyboard
  var onVV = function () {
    var vv = window.visualViewport;
    var kb = Math.round(window.innerHeight - vv.height - vv.offsetTop);
    kbHeight = kb > 80 ? kb : 0;
    applyContentPad();
  };
  window.visualViewport.addEventListener('resize', onVV, false);
  window.visualViewport.addEventListener('scroll', onVV, false);
}

applyTheme();
initMap();
layout();
setState(1, false);
renderHome();
locate(true);
</script>
</body>
</html>
