          background: #566f98; background: -webkit-linear-gradient(top, #9aacc7 0%, #6a82a7 49%, #536d96 50%, #4f6992 100%); background: linear-gradient(to bottom, #9aacc7 0%, #6a82a7 49%, #536d96 50%, #4f6992 100%); box-shadow: 0 1px 4px rgba(0,0,0,.5); }

<body class="ed-ios6">
<div id="map"></div>
<div id="mapWarn" class="warn" style="display:none">The map pictures could not load on this device. Stops, search and times still work. (Tap to hide)</div>

<div id="topbar" class="topbar">
  <div class="tb-row">
    <button id="cancel" class="tbtn tcancel" type="button" style="display:none">Cancel</button>
    <button id="nearBtn" class="tbtn tnear" type="button">Nearby</button>
    <img class="tlogo" src="../web-logo.png" width="30" height="30" alt="" onerror="this.style.display='none'">
    <div class="sfield">
      <svg class="sglass" viewBox="0 0 24 24" width="14" height="14"><circle cx="10" cy="10" r="6.5" fill="none" stroke="#8e8e93" stroke-width="2.8"/><line x1="15" y1="15" x2="21" y2="21" stroke="#8e8e93" stroke-width="2.8" stroke-linecap="round"/></svg>
      <input id="q" type="text" placeholder="Search bus stops" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
      <button id="clear" class="sclear" type="button" style="display:none" aria-label="Clear">&times;</button>
    </div>
  </div>
</div>

<button id="areaBtn" class="area" type="button" style="display:none">Search this area</button>

<div id="botbar" class="botbar">
  <button id="locate" class="bbtn blocate" type="button" aria-label="Show my location"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3z" stroke-linejoin="round"/></svg></button>
  <button id="infoBtn" class="bbtn binfo" type="button" aria-label="Info"></button>
</div>

<div id="overlay" class="overlay"><div id="olist" class="olist"></div></div>

<div id="screen" class="screen">
  <div class="navbar">
    <button id="back" class="nback" type="button">Back</button>
    <div id="ntitle" class="ntitle"></div>
  </div>
  <div id="sbody" class="sbody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/leaflet.js"></script>
<script>
/* Classic edition: an Apple Maps look-alike for older iPhones and iPads. ES5 only. */

/* ===== Settings you can change ===== */
var API_BASE = 'https://busproxy.zkbus221.workers.dev';   // <-- your Worker address
var REFRESH_MS = 20000;        // arrivals refresh (milliseconds)
var NEARBY_RADIUS = 1000;       // metres
var TILE_URL = API_BASE + '/tile/{z}/{x}/{y}.png';   // map pictures come through your Worker, because old iOS cannot reach OpenStreetMap directly
var MAX_DOTS = 40;             // most stop pins drawn on the map
var MAX_RESULTS = 40;          // most stops listed for one search
var START_VIEW = [51.5074, -0.1278];   // used if location is unavailable (central London)
/* =================================== */

var BUS_SVG = '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="3" width="16" height="15" rx="3" fill="#fff"/><rect x="6" y="5.5" width="12" height="5" rx="1" class="bd"/><circle cx="8.5" cy="14.5" r="1.4" class="bd"/><circle cx="15.5" cy="14.5" r="1.4" class="bd"/><rect x="6" y="18" width="3" height="3" rx="1" fill="#fff"/><rect x="15" y="18" width="3" height="3" rx="1" fill="#fff"/></svg>';

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) { e.className = cls; }
  if (text !== undefined) { e.textContent = text; }
  return e;
}

function two(n) { return ('0' + n).slice(-2); }

function toArray(x) { return Object.prototype.toString.call(x) === '[object Array]' ? x : [x]; }

function getJSON(path, onOk, onFail, tries) {
  tries = tries || 0;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', API_BASE + path, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) { return; }
    if (xhr.status >= 200 && xhr.status < 300) {
      var data;
      try { data = JSON.parse(xhr.responseText); }
      catch (e) { onFail('Could not read the response from TfL.', 0); return; }
      onOk(data);
    } else if (xhr.status === 429) {
      if (tries < 2) {   // wait a moment and try again before giving up
        setTimeout(function () { getJSON(path, onOk, onFail, tries + 1); }, 2000 * (tries + 1));
        return;
      }
      onFail('TfL is limiting requests right now. Wait a few seconds and try again.', 429);
    } else if (xhr.status === 0) {
      onFail('Could not connect. Check your internet connection.', 0);
    } else {
      var detail = '';
      try { var j = JSON.parse(xhr.responseText); if (j && j.message) { detail = ' ' + String(j.message).slice(0, 140); } } catch (e) {}
      onFail('TfL did not accept that request (status ' + xhr.status + ').' + detail, xhr.status);
    }
  };
  xhr.send();
}

function normalize(sp) {
  var towards = '', i, props = sp.additionalProperties || [];
  for (i = 0; i < props.length; i++) {
    if (props[i].key === 'Towards') { towards = props[i].value; }
  }
  var lines = [], ls = sp.lines || [];
  for (i = 0; i < ls.length; i++) { lines.push(ls[i].name); }
  return {
    id: sp.naptanId || sp.id,
    name: sp.commonName,
    label: sp.commonName + (sp.indicator ? ' (' + sp.indicator + ')' : ''),   // e.g. Golders Green Station (Stop A)
    lat: sp.lat, lon: sp.lon,
    towards: towards,
    letter: String(sp.stopLetter || sp.indicator || '').replace(/^stop\s+/i, '').toUpperCase(),
    distance: sp.distance || 0,
    lines: lines,
    detail: true
  };
}

// A search can return a whole station or interchange. Dig out the individual bus stops inside it.

function isBusStop(sp) {
  return sp.stopType === 'NaptanPublicBusCoachTfl' ||
         (sp.modes && String(sp.modes).indexOf('bus') !== -1 && !(sp.children && sp.children.length));
}

function leafStops(sp, out) {
  var kids = sp.children || [], i;
  if (kids.length) { for (i = 0; i < kids.length; i++) { leafStops(kids[i], out); } }
  else if (isBusStop(sp)) { out.push(sp); }
}

function distanceM(lat1, lon1, lat2, lon2) {
  var rad = Math.PI / 180, dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return Math.round(6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

// "Hill Rd" -> "Hill Road", for when a search finds nothing

function expandAbbrev(t) {
  var m = { rd: 'road', ave: 'avenue', av: 'avenue', ln: 'lane', gdns: 'gardens', gdn: 'garden', stn: 'station', pl: 'place', sq: 'square',
            cres: 'crescent', dr: 'drive', ct: 'court', pk: 'park', hosp: 'hospital', jct: 'junction', ter: 'terrace', gr: 'grove',
            cl: 'close', hse: 'house', sch: 'school', ctr: 'centre', ctre: 'centre', univ: 'university', rbt: 'roundabout' };
  var out = t.replace(/\b([A-Za-z]+)\.?(?=\s|$)/g, function (w, a) { return m[a.toLowerCase()] || w; });
  out = out.replace(/^st\.?\s/i, 'saint ').replace(/\sst\.?$/i, ' street');
  return out;
}

// Other spellings to try when a search finds nothing: "kings cross" -> "king's cross", "hill rd" -> "hill road"

function searchVariants(t) {
  var out = [t], seen = {}, cand, i, v;
  seen[t.toLowerCase()] = true;
  var apo = t.replace(/\b([A-Za-z]{3,})s\b/g, function (w, a) { return /s$/i.test(a) ? w : a + "'s"; });
  cand = [apo, t.replace(/['\u2019]/g, ''), expandAbbrev(t), expandAbbrev(apo)];
  for (i = 0; i < cand.length; i++) {
    v = cand[i];
    if (v && !seen[v.toLowerCase()]) { seen[v.toLowerCase()] = true; out.push(v); }
  }
  return out;
}

function loadRecents() {
  try {
    var r = JSON.parse(localStorage.getItem('busRecents') || '[]');
    return Object.prototype.toString.call(r) === '[object Array]' ? r : [];
  } catch (e) { return []; }
}

function saveRecents() {
  try { localStorage.setItem('busRecents', JSON.stringify(recents)); } catch (e) {}
}

function addRecent(item) {
  var out = [{ id: item.id, name: item.name, label: item.label, lat: item.lat, lon: item.lon, towards: item.towards, lines: item.lines || [] }];
  for (var i = 0; i < recents.length; i++) {
    if (recents[i].id !== item.id) { out.push(recents[i]); }
  }
  recents = out.slice(0, 8);
  saveRecents();
}

function loadVeh() {
  try {
    var v = JSON.parse(localStorage.getItem('busVeh') || '{}');
    return (v && typeof v === 'object') ? v : {};
  } catch (e) { return {}; }
}

function saveVeh() {
  try {
    var n = 0, k;
    for (k in vehMem) { if (vehMem.hasOwnProperty(k)) { n++; } }
    if (n > 400) { vehMem = {}; }
    localStorage.setItem('busVeh', JSON.stringify(vehMem));
  } catch (e) {}
}

var vehMem = loadVeh();       // saved on this device so each bus is only looked up once

var vehQueue = [], vehBusy = 0, vehPending = {};

function prettyReg(r) { return /^[A-Z]{2}[0-9]{2}[A-Z]{3}$/.test(r) ? r.slice(0, 4) + ' ' + r.slice(4) : r; }

function lookupVehicle(reg, cb) {
  var c = vehMem[reg], now = new Date().getTime();
  if (c && now - c.t < (c.ok ? 7 * 86400000 : 86400000)) { cb(c); return; }
  if (vehPending[reg]) { vehPending[reg].push(cb); return; }
  vehPending[reg] = [cb];
  vehQueue.push(reg);
  pumpVeh();
}

function finishVeh(reg, rec) {
  vehBusy--;
  var cbs = vehPending[reg] || [];
  delete vehPending[reg];
  for (var i = 0; i < cbs.length; i++) { cbs[i](rec); }
  pumpVeh();
}

function pumpVeh() {
  while (vehBusy < 2 && vehQueue.length) {
    (function (reg) {
      vehBusy++;
      getJSON('/vehicle/' + encodeURIComponent(reg),
        function (d) {
          var rec = { ok: !!d.found, op: d.operator || '', fleet: d.fleet || '', type: d.type || '', t: new Date().getTime() };
          if (!d.error) { vehMem[reg] = rec; saveVeh(); }
          finishVeh(reg, rec);
        },
        function () { finishVeh(reg, { ok: false, op: '', fleet: '', type: '', t: 0 }); });
    })(vehQueue.shift());
  }
}

var DAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

function clearNode(e) { while (e.firstChild) { e.removeChild(e.firstChild); } }

function fmtTime(min) { return two(Math.floor(min / 60) % 24) + ':' + two(min % 60); }

function hmMin(o) { return parseInt(o.hour, 10) * 60 + parseInt(o.minute, 10); }

// Does a schedule called e.g. "Monday - Friday" or "Saturday" run on weekday number dow (0 = Sunday)?

function scheduleRunsOn(name, dow) {
  var n = String(name || '').toLowerCase(), found = [], i, at, k, d;
  if (n.indexOf('holiday') !== -1) { return false; }
  for (i = 0; i < 7; i++) {
    at = n.indexOf(DAY_NAMES[i]);
    if (at === -1) { at = n.indexOf(DAY_NAMES[i].slice(0, 3)); }
    if (at !== -1) { found.push({ d: i, at: at }); }
  }
  if (!found.length) { return /daily|every day|all days|7 days/.test(n); }
  found.sort(function (a, b) { return a.at - b.at; });
  if (found.length === 2 && /-|\bto\b|\u2013/.test(n.slice(found[0].at, found[1].at))) {   // a range, such as Monday - Friday
    d = found[0].d;
    for (k = 0; k < 7; k++) {
      if (d === dow) { return true; }
      if (d === found[1].d) { break; }
      d = (d + 1) % 7;
    }
    return false;
  }
  for (i = 0; i < found.length; i++) { if (found[i].d === dow) { return true; } }
  return false;
}

// Work out the next scheduled times from the saved timetables

function buildSchedule(tts) {
  var now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes(), dow = now.getDay();
  var times = [], freqAll = [], seen = {}, withTimes = {}, t, r, s, o, j, p;
  for (t = 0; t < tts.length; t++) {
    var tt = tts[t].tt, line = tts[t].line;
    var routes = (tt && tt.timetable && tt.timetable.routes) || [];
    for (r = 0; r < routes.length; r++) {
      var scheds = routes[r].schedules || [];
      for (s = 0; s < scheds.length; s++) {
        var sc = scheds[s];
        for (o = -1; o <= 1; o++) {                       // yesterday, today, tomorrow
          if (!scheduleRunsOn(sc.name, (dow + o + 7) % 7)) { continue; }
          var jn = sc.knownJourneys || [];
          for (j = 0; j < jn.length; j++) {
            var m = hmMin(jn[j]), abs = o * 1440 + m, key = line + '|' + abs;
            if (isNaN(m) || abs <= nowMin || seen[key]) { continue; }
            seen[key] = true; withTimes[line] = true;
            times.push({ abs: abs, line: line });
          }
          if (o === 0) {                                   // services that run "every X minutes"
            var ps = sc.periods || [];
            for (p = 0; p < ps.length; p++) {
              if (!ps[p].frequency || !ps[p].fromTime || !ps[p].toTime) { continue; }
              var from = hmMin(ps[p].fromTime), to = hmMin(ps[p].toTime);
              if (to < from) { to += 1440; }
              if (!isNaN(from) && !isNaN(to) && to > nowMin) {
                freqAll.push({ line: line, from: from, to: to, lo: ps[p].frequency.lowestFrequency, hi: ps[p].frequency.highestFrequency });
              }
            }
          }
        }
      }
    }
  }
  times.sort(function (a, b) { return a.abs - b.abs; });
  freqAll.sort(function (a, b) { return a.from - b.from; });
  var freqs = [], done = {};
  for (j = 0; j < freqAll.length; j++) {
    if (!done[freqAll[j].line] && !withTimes[freqAll[j].line]) { done[freqAll[j].line] = true; freqs.push(freqAll[j]); }
  }
  return { times: times.slice(0, 10), freqs: freqs };
}

function ensureLines(item, cb) {
  if (item.lines && item.lines.length) { cb(); return; }
  getJSON('/StopPoint/' + encodeURIComponent(item.id),
    function (res) {
      var sp = toArray(res)[0];
      if (sp && sp.commonName) { item.lines = normalize(sp).lines; }
      cb();
    },
    function () { cb(); });
}

var nearbyTry = 0;      // which way of asking TfL worked last time

function nearbyPaths(la, lo) {
  var base = '/StopPoint?lat=' + la + '&lon=' + lo + '&radius=' + NEARBY_RADIUS;
  var extra = '&modes=bus&returnLines=true&categories=Direction&useStopPointHierarchy=false';
  return [
    base + '&stopTypes=NaptanPublicBusCoachTram' + extra,
    base + '&stopTypes=NaptanPublicBusCoachTfl' + extra,
    base + '&stopTypes=NaptanPublicBusCoachTram',
    base + '&stopTypes=NaptanPublicBusCoachTfl',
    base + '&stopTypes=NaptanOnstreetBusCoachStopPair' + extra
  ];
}

function fetchNearby(la, lo, ok, fail) {
  var paths = nearbyPaths(la, lo), tried = 0, lastMsg = '';
  var attempt = function () {
    if (tried >= paths.length) { fail(lastMsg); return; }
    var idx = (nearbyTry + tried) % paths.length;
    getJSON(paths[idx],
      function (data) { nearbyTry = idx; ok(data); },
      function (msg, status) {
        lastMsg = msg;
        if (status === 400 || status === 404) { tried++; attempt(); } else { fail(msg); }
      });
  };
  attempt();
}

function searchItems(arr) {
  var leaves = [], items = [], seen = {}, i, it;
  for (i = 0; i < arr.length; i++) { if (arr[i]) { leafStops(arr[i], leaves); } }
  for (i = 0; i < leaves.length; i++) {
    it = normalize(leaves[i]);
    if (!it.id || seen[it.id]) { continue; }
    seen[it.id] = true;
    it.detail = !!(leaves[i].additionalProperties && leaves[i].additionalProperties.length);   // children often lack "Towards"
    items.push(it);
  }
  return items;
}

function arrivalsForKids(mine, ok, fail) {
  var kids = mine.kids.slice(0, 12), pending = kids.length, all = [], bad = 0;
  var one = function (kid) {
    getJSON('/StopPoint/' + encodeURIComponent(kid.id) + '/Arrivals',
      function (d) {
        for (var i = 0; i < d.length; i++) { if (!d[i].platformName || d[i].platformName === 'null') { d[i].platformName = kid.letter; } all.push(d[i]); }
        if (--pending === 0) { ok(all); }
      },
      function () { bad++; if (--pending === 0) { if (bad === kids.length) { fail('Could not reach TfL.'); } else { ok(all); } } });
  };
  for (var i = 0; i < kids.length; i++) { one(kids[i]); }
}

// If a stop says nothing, ask by route instead

function arrivalsByLine(mine, ok) {
  ensureLines(mine, function () {
    var names = (mine.lines || []).slice(0, 10), ids = [], i;
    if (!names.length) { ok([]); return; }
    for (i = 0; i < names.length; i++) { ids.push(encodeURIComponent(names[i].toLowerCase())); }
    getJSON('/Line/' + ids.join(',') + '/Arrivals/' + encodeURIComponent(mine.id),
      function (d) { ok(Object.prototype.toString.call(d) === '[object Array]' ? d : []); },
      function () { ok([]); });
  });
}

var q = $('q');
var map = null, nearbyLayer = null, selectedMarker = null, youMarker = null, attrib = null;
var stack = [], screenTimer = null;                     // screens opened on top of the map; the last one is showing
var overlayOn = false, homeItems = [], homeNote = '', homeLoading = false, stickyNote = '';
var searchSeq = 0, searchTimer = null, searchState = { q: '', busy: false, items: null, msg: '' };
var recents = loadRecents();
var nearbyCache = {}, searchCache = {};
var STOP_ICON = null, STOP_ICON_SEL = null;

function trimmed(s) { return s.replace(/^\s+|\s+$/g, ''); }
function curScreen() { return stack.length ? stack[stack.length - 1] : null; }

/* ---------- map ---------- */

function stopIcons() {
  if (!STOP_ICON && typeof L !== 'undefined') {
    STOP_ICON = L.divIcon({ className: 'stopico', html: BUS_SVG, iconSize: [30, 30], iconAnchor: [15, 15] });
    STOP_ICON_SEL = L.divIcon({ className: 'stopico sel', html: BUS_SVG, iconSize: [30, 30], iconAnchor: [15, 15] });
  }
}

function initMap() {
  if (typeof L === 'undefined') { $('map').style.display = 'none'; homeNote = 'The map could not load, but search still works.'; return; }
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView(START_VIEW, 16);
  var tiles = L.tileLayer(TILE_URL, { maxZoom: 19 }).addTo(map);
  var ok = 0, bad = 0;
  tiles.on('tileload', function () { ok++; });
  tiles.on('tileerror', function () { bad++; });
  setTimeout(function () {
    if (ok || !bad) { return; }
    var w = $('mapWarn');
    w.style.display = 'block';
    var x = new XMLHttpRequest();          // ask the Worker for one map picture to find out why
    x.open('GET', API_BASE + '/tile/0/0/0.png', true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var why = x.status === 404 ? ' Your Worker has no map-picture route yet: deploy the newest worker.mjs.' :
                (x.status === 0 ? ' The device could not reach your Worker for pictures.' : ' (picture test: status ' + x.status + ')');
      w.textContent = 'The map pictures could not load.' + why + ' Stops, search and times still work. Tap to hide.';
    };
    x.send();
  }, 8000);
  attrib = L.control.attribution({ prefix: false, position: 'bottomright' });
  attrib.addAttribution('&copy; OpenStreetMap contributors');
  attrib.addTo(map);
  nearbyLayer = L.layerGroup().addTo(map);
  map.on('dragend', function () { if (!overlayOn && !stack.length) { $('areaBtn').style.display = 'block'; } });
}

// The speech bubble over a stop pin: name, next buses, and an arrow to the full list
function makeCallout(item) {
  var box = { el: el('div', 'call'), sub: null, seq: 0 };
  var main = el('div', 'call-main');
  main.appendChild(el('div', 'call-title', item.label));
  box.sub = el('div', 'call-sub', item.towards ? 'Towards ' + item.towards : '');
  main.appendChild(box.sub);
  box.el.appendChild(main);
  box.el.appendChild(el('div', 'call-go'));
  box.el.onclick = function () { if (map) { map.closePopup(); } openStop(item, 'map'); };
  return box;
}

function fillCallout(box, item) {
  var my = ++box.seq;
  box.sub.textContent = 'Loading departures\u2026';
  getJSON('/StopPoint/' + encodeURIComponent(item.id) + '/Arrivals',
    function (data) {
      if (my !== box.seq) { return; }
      data.sort(function (a, b) { return a.timeToStation - b.timeToStation; });
      var parts = [], i, mins;
      for (i = 0; i < data.length && i < 2; i++) {
        mins = Math.floor(data[i].timeToStation / 60);
        parts.push(data[i].lineName + ' ' + (mins < 1 ? 'due' : 'in ' + mins + ' min'));
      }
      box.sub.textContent = parts.length ? 'Next: ' + parts.join(', ') : 'No buses due right now';
    },
    function () { if (my === box.seq) { box.sub.textContent = item.towards ? 'Towards ' + item.towards : 'Tap for departures'; } });
}

function drawDots(items) {
  if (!nearbyLayer) { return; }
  stopIcons();
  nearbyLayer.clearLayers();
  for (var i = 0; i < items.length && i < MAX_DOTS; i++) {
    (function (item) {
      if (item.lat === undefined) { return; }
      var m = L.marker([item.lat, item.lon], { icon: STOP_ICON, keyboard: false });
      var box = makeCallout(item);
      m.bindPopup(box.el, { closeButton: false, minWidth: 150, maxWidth: 260, offset: [0, -14], autoPanPadding: L.point(10, 62) });
      m.on('popupopen', function () { m.setIcon(STOP_ICON_SEL); fillCallout(box, item); });
      m.on('popupclose', function () { m.setIcon(STOP_ICON); });
      m.addTo(nearbyLayer);
    })(items[i]);
  }
}

function setSelected(lat, lon) {
  removeSelected();
  if (!map || lat === undefined) { return; }
  stopIcons();
  selectedMarker = L.marker([lat, lon], { icon: STOP_ICON_SEL, zIndexOffset: 1000, clickable: false, keyboard: false }).addTo(map);
}
function removeSelected() {
  if (selectedMarker && map) { map.removeLayer(selectedMarker); }
  selectedMarker = null;
}

/* ---------- nearby stops and location ---------- */

function applyNearby(items) {
  homeItems = items; homeLoading = false;
  homeNote = items.length ? stickyNote : 'No bus stops within ' + NEARBY_RADIUS + ' m. Drag the map and try Search this area.';
  drawDots(items);
  renderOverlay();
}

function loadNearby(lat, lon) {
  var lat0 = Number(lat), lon0 = Number(lon);
  var la = lat0.toFixed(3), lo = lon0.toFixed(3);
  var key = la + ',' + lo, hit = nearbyCache[key];
  if (hit && new Date().getTime() - hit.t < 300000) { applyNearby(hit.items); return; }
  homeLoading = true; homeNote = '';
  renderOverlay();
  fetchNearby(la, lo,
    function (data) {
      var stops = data.stopPoints || [], leaves = [], items = [], seen = {}, i, it;
      for (i = 0; i < stops.length; i++) { leafStops(stops[i], leaves); }
      for (i = 0; i < leaves.length; i++) {
        it = normalize(leaves[i]);
        if (!it.id || seen[it.id] || it.lat === undefined) { continue; }
        seen[it.id] = true;
        it.distance = distanceM(lat0, lon0, it.lat, it.lon);
        it.detail = !!(leaves[i].additionalProperties && leaves[i].additionalProperties.length);
        if (it.distance <= NEARBY_RADIUS + 150) { items.push(it); }
      }
      items.sort(function (a, b) { return a.distance - b.distance; });
      nearbyCache[key] = { t: new Date().getTime(), items: items };
      applyNearby(items);
    },
    function (msg) { homeLoading = false; homeNote = msg; renderOverlay(); });
}

function fallbackStart(note) {
  var c = map ? map.getCenter() : { lat: START_VIEW[0], lng: START_VIEW[1] };
  stickyNote = note;
  loadNearby(c.lat, c.lng);
}

function locate(initial) {
  if (!navigator.geolocation) { fallbackStart('This device cannot share its location.'); return; }
  homeLoading = true; homeNote = 'Finding your location\u2026';
  renderOverlay();
  navigator.geolocation.getCurrentPosition(
    function (pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      stickyNote = '';
      if (map) {
        map.setView([lat, lon], 16);
        if (youMarker) { map.removeLayer(youMarker); }
        youMarker = L.circleMarker([lat, lon], { radius: 8, color: '#fff', weight: 3, fillColor: '#2a7de1', fillOpacity: 1 }).addTo(map);
      }
      loadNearby(lat, lon);
    },
    function () {
      fallbackStart(initial ? 'Showing central London. Tap the arrow at the bottom left to use your location.' : 'Could not get your location. Check that location access is allowed for this site.');
    },
    { timeout: 10000, maximumAge: 60000 }
  );
}

/* ---------- search ---------- */

function searchStops(text, done, fail) {
  var key = text.toLowerCase();
  if (searchCache[key]) { done(searchCache[key]); return; }
  var name = text, letter = '', lm = text.match(/^(.*\S)\s+stop\s+([a-z0-9]{1,2})$/i);   // "king's cross stop d"
  if (lm) { name = lm[1]; letter = lm[2].toUpperCase(); }

  var finish = function (items) {
    var k, f = [];
    if (letter) {
      for (k = 0; k < items.length; k++) { if (items[k].letter === letter) { f.push(items[k]); } }
      if (f.length) { items = f; }
    }
    items = items.slice(0, MAX_RESULTS);
    if (items.length) { searchCache[key] = items; }
    done(items);
  };

  var variants = searchVariants(name);
  var byName = function (vi) {
    if (vi >= variants.length) { done([]); return; }
    getJSON('/StopPoint/Search?query=' + encodeURIComponent(variants[vi]) + '&modes=bus&maxResults=' + MAX_RESULTS,
      function (data) {
        var ms = data.matches || [], ids = [], seen = {}, basics = [], i;
        for (i = 0; i < ms.length; i++) {
          if (seen[ms[i].id]) { continue; }
          seen[ms[i].id] = true; ids.push(encodeURIComponent(ms[i].id));
          basics.push({ id: ms[i].id, name: ms[i].name, label: ms[i].name, lat: ms[i].lat, lon: ms[i].lon, towards: '', distance: 0, lines: [], detail: false });
        }
        if (!ids.length) { byName(vi + 1); return; }
        getJSON('/StopPoint/' + ids.join(','),
          function (res) { var items = searchItems(toArray(res)); finish(items.length ? items : basics); },
          function () { done(basics); });
      },
      function (msg, status) {
        if (status === 404) { byName(vi + 1); return; }      // TfL answers 404 when a spelling matches nothing
        fail(msg);
      });
  };

  if (/^\d{5}$/.test(text)) {          // a five-digit stop code, as printed on the bus stop sign
    getJSON('/StopPoint/Sms/' + text,
      function (res) { var items = searchItems(toArray(res)); if (items.length) { finish(items); } else { byName(0); } },
      function () { byName(0); });
  } else { byName(0); }
}

function runSearch(v) {
  var my = ++searchSeq;
  searchState = { q: v, busy: true, items: null, msg: '' };
  renderOverlay();
  searchStops(v,
    function (items) { if (my !== searchSeq) { return; } searchState = { q: v, busy: false, items: items, msg: '' }; renderOverlay(); },
    function (msg) { if (my !== searchSeq) { return; } searchState = { q: v, busy: false, items: null, msg: msg }; renderOverlay(); });
}

/* ---------- lists (search, nearby, recents) ---------- */

function stopRow(item, withDistance, from) {
  var li = el('li', 'row go');
  var icon = el('div', 'sicon'); icon.innerHTML = BUS_SVG;
  var body = el('div', 'rbody');
  body.appendChild(el('div', 'rt', item.label));
  if (item.towards) { body.appendChild(el('div', 'rs', 'Towards ' + item.towards)); }
  if (item.lines && item.lines.length) {
    var chips = el('div', 'chips'), n = Math.min(item.lines.length, 6);
    for (var i = 0; i < n; i++) { chips.appendChild(el('span', 'chip', item.lines[i])); }
    body.appendChild(chips);
  }
  li.appendChild(icon); li.appendChild(body);
  if (withDistance && item.distance) { li.appendChild(el('div', 'rd', Math.round(item.distance) + ' m')); }
  li.onclick = function () { openStop(item, from); };
  return li;
}

function stopList(items, withDistance, from) {
  var ul = el('ul', 'tbl');
  for (var i = 0; i < items.length; i++) { ul.appendChild(stopRow(items[i], withDistance, from)); }
  return ul;
}

function secHead(text, linkText, linkFn) {
  var h = el('div', 'sec', text);
  if (linkText) {
    var b = el('button', 'seclink', linkText); b.type = 'button'; b.onclick = linkFn;
    h.appendChild(b);
  }
  return h;
}

function renderOverlay() {
  if (!overlayOn) { return; }
  var list = $('olist'), keep = $('overlay').scrollTop;
  clearNode(list);
  var v = trimmed(q.value);
  if (v.length >= 3) {
    if (searchState.busy || searchState.q !== v) { list.appendChild(el('div', 'note', 'Searching\u2026')); return; }
    if (searchState.msg) { list.appendChild(el('div', 'note err', searchState.msg)); return; }
    var items = searchState.items || [];
    if (!items.length) { list.appendChild(el('div', 'note', 'No bus stops found for \u201C' + v + '\u201D.')); return; }
    if (items.length >= MAX_RESULTS) { list.appendChild(el('div', 'note', 'Showing the first ' + MAX_RESULTS + ' stops. Add the stop letter to narrow it down, for example \u201C' + v.replace(/\s+stop\s+\w+$/i, '') + ' stop D\u201D.')); }
    list.appendChild(stopList(items, false, 'overlay'));
    return;
  }
  list.appendChild(secHead('Nearby'));
  if (homeLoading && !homeItems.length) { list.appendChild(el('div', 'note', homeNote || 'Finding stops\u2026')); }
  else {
    if (homeNote) { list.appendChild(el('div', 'note', homeNote)); }
    if (homeItems.length) { list.appendChild(stopList(homeItems.slice(0, 10), true, 'overlay')); }
  }
  if (recents.length) {
    list.appendChild(secHead('Recents', 'Clear', function () { recents = []; saveRecents(); renderOverlay(); }));
    list.appendChild(stopList(recents, false, 'overlay'));
  }
  $('overlay').scrollTop = keep;
}

function setSearchMode(on) {
  $('cancel').style.display = on ? 'block' : 'none';
  $('nearBtn').style.display = on ? 'none' : 'block';
  overlayOn = on;
  $('overlay').style.display = on ? 'block' : 'none';
  document.body.className = document.body.className.replace(/\s*\bov\b/g, '') + (on ? ' ov' : '');
  if (on) { $('areaBtn').style.display = 'none'; renderOverlay(); }
}

/* ---------- screens that slide over the map ---------- */

function clearScreenTimer() { if (screenTimer) { clearInterval(screenTimer); screenTimer = null; } }

function showScreen() {
  var s = curScreen();
  clearScreenTimer();
  if (!s) { $('screen').style.display = 'none'; return; }
  $('screen').style.display = 'block';
  $('ntitle').textContent = s.type === 'stop' ? 'Bus stop' : (s.type === 'bus' ? 'Bus' : 'Info');
  $('back').textContent = stack.length > 1 ? 'Back' : (s.from === 'overlay' ? 'Search' : 'Map');
  var body = $('sbody');
  clearNode(body);
  body.scrollTop = 0;
  var col = el('div', 'col');          // one centred column, so everything lines up on a wide iPad screen too
  body.appendChild(col);
  if (s.type === 'stop') { buildStopScreen(s, col); }
  else if (s.type === 'bus') { buildBusScreen(s, col); }
  else { buildInfoScreen(s, col); }
}

function pushScreen(s) { stack.push(s); showScreen(); }

function popScreen() {
  stack.pop();
  showScreen();
  if (!stack.length) { removeSelected(); }
}

function openStop(item, from) {
  if (map) { map.closePopup(); }
  q.blur();
  pushScreen({ type: 'stop', item: item, from: from || 'map' });
}

function endBody(body) { body.appendChild(el('div', 'spacer')); }

/* ----- a bus stop ----- */

function fillVeh(reg, fleetEl) {
  lookupVehicle(reg, function (rec) { if (rec.ok) { fleetEl.textContent = rec.fleet; } });
}

function buildStopScreen(s, body) {
  var item = s.item;
  var hdr = el('div', 'hdr');
  s.titleEl = el('h1', 'hname', item.label);
  s.subEl = el('div', 'hsub', item.towards ? 'Towards ' + item.towards : '');
  s.subEl.style.display = item.towards ? 'block' : 'none';
  hdr.appendChild(s.titleEl); hdr.appendChild(s.subEl);
  body.appendChild(hdr);
  body.appendChild(el('div', 'sec2', 'Next buses'));
  s.note = el('div', 'note', 'Loading arrivals\u2026'); body.appendChild(s.note);
  s.list = el('ul', 'tbl'); s.list.style.display = 'none'; body.appendChild(s.list);
  s.sched = el('div', 'sched'); s.sched.style.display = 'none'; body.appendChild(s.sched);
  s.upd = el('div', 'upd'); body.appendChild(s.upd);
  endBody(body);

  addRecent(item);
  setSelected(item.lat, item.lon);
  if (map && item.lat !== undefined) {
    map.setView([item.lat, item.lon], Math.max(map.getZoom(), 16));
    if (s.from !== 'map') { loadNearby(item.lat, item.lon); }
  }
  if (!item.detail) { fetchDetail(s); }
  loadStopArrivals(s);
  screenTimer = setInterval(function () { loadStopArrivals(s); }, REFRESH_MS);
}

function fetchDetail(s) {
  var item = s.item;
  getJSON('/StopPoint/' + encodeURIComponent(item.id), function (res) {
    var sp = toArray(res)[0];
    if (!sp || !sp.commonName) { return; }
    var d = normalize(sp);
    item.label = d.label; item.towards = d.towards || item.towards; item.lines = d.lines; item.detail = true;
    if (item.lat === undefined) { item.lat = d.lat; item.lon = d.lon; }
    var leaves = [], li;
    leafStops(sp, leaves);
    if (sp.children && sp.children.length && leaves.length) {      // a whole station: watch every stop inside it
      item.kids = [];
      for (li = 0; li < leaves.length; li++) { var kd = normalize(leaves[li]); item.kids.push({ id: kd.id, letter: kd.letter }); }
      if (curScreen() === s) { loadStopArrivals(s); }
    }
    addRecent(item);
    if (curScreen() === s && s.titleEl) {
      s.titleEl.textContent = item.label;
      if (item.towards) { s.subEl.textContent = 'Towards ' + item.towards; s.subEl.style.display = 'block'; }
    }
  }, function () {});
}

function loadStopArrivals(s) {
  if (curScreen() !== s || document.hidden) { return; }
  var item = s.item;
  var show = function (data) { if (curScreen() === s) { renderStopArrivals(s, data); } };
  var fail = function (msg) { if (curScreen() === s) { s.note.style.display = 'block'; s.note.textContent = msg; s.note.className = 'note err'; } };
  if (item.kids && item.kids.length) { arrivalsForKids(item, show, fail); return; }
  getJSON('/StopPoint/' + encodeURIComponent(item.id) + '/Arrivals',
    function (data) { if (data.length) { show(data); } else { arrivalsByLine(item, show); } },
    fail);
}

function renderStopArrivals(s, data) {
  clearNode(s.list);
  data.sort(function (a, b) { return a.timeToStation - b.timeToStation; });
  if (!data.length) {
    s.list.style.display = 'none';
    s.note.style.display = 'block'; s.note.className = 'note'; s.note.textContent = 'No buses due at this stop right now.';
    loadSched(s);
  } else {
    s.sched.style.display = 'none';
    s.note.style.display = 'none';
    var now = new Date().getTime(), i;
    for (i = 0; i < data.length; i++) {
      var a = data[i], mins = Math.floor(a.timeToStation / 60), when = new Date(now + a.timeToStation * 1000);
      var li = el('li', 'row arr' + (a.vehicleId ? ' go' : ''));
      if (a.vehicleId) { li.onclick = (function (arrival, st) { return function () { pushScreen({ type: 'bus', arr: arrival, item: st.item, from: 'stop' }); }; })(a, s); }
      li.appendChild(el('div', 'badge', a.lineName));
      var mid = el('div', 'rbody');
      mid.appendChild(el('div', 'rt', a.destinationName || a.towards || ''));
      if (s.item.kids && s.item.kids.length && a.platformName) { mid.appendChild(el('div', 'rs', 'Stop ' + a.platformName)); }
      var reg = String(a.vehicleId || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (i < 8 && reg.length >= 2 && reg.length <= 8) {
        var veh = el('div', 'veh'), fleetEl = el('span', 'vfleet');
        veh.appendChild(fleetEl); veh.appendChild(el('span', 'plate', prettyReg(reg)));
        mid.appendChild(veh);
        fillVeh(reg, fleetEl);
      }
      li.appendChild(mid);
      var col = el('div', 'mcol');
      col.appendChild(el('div', 'mins', mins < 1 ? 'Due' : mins + ' min'));
      col.appendChild(el('div', 'clock', two(when.getHours()) + ':' + two(when.getMinutes())));
      li.appendChild(col);
      s.list.appendChild(li);
    }
    s.list.style.display = 'block';
  }
  var d = new Date();
  s.upd.textContent = 'Updated ' + two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()) + '. Refreshes every ' + (REFRESH_MS / 1000) + ' seconds. Fleet details from bustimes.org.';
}

/* ----- timetable, when no buses are due ----- */

function schedNote(s, text) {
  clearNode(s.sched);
  s.sched.style.display = 'block';
  s.sched.appendChild(el('div', 'sec2', 'Scheduled departures'));
  s.sched.appendChild(el('div', 'note', text));
}

function showSched(s) {
  var item = s.item, res = buildSchedule(item.ttRaw), i, li, body, ul;
  clearNode(s.sched);
  s.sched.style.display = 'block';
  s.sched.appendChild(el('div', 'sec2', 'Scheduled departures'));
  if (!res.times.length && !res.freqs.length) { s.sched.appendChild(el('div', 'note', 'No more scheduled departures found for this stop today.')); return; }
  s.sched.appendChild(el('div', 'snote', 'From the timetable, not live tracking.'));
  if (res.times.length) {
    ul = el('ul', 'tbl');
    for (i = 0; i < res.times.length; i++) {
      li = el('li', 'row arr srow');
      li.appendChild(el('div', 'badge', res.times[i].line));
      body = el('div', 'rbody');
      body.appendChild(el('div', 'rt', fmtTime(res.times[i].abs % 1440)));
      if (res.times[i].abs >= 1440) { body.appendChild(el('div', 'rs', 'Tomorrow')); }
      li.appendChild(body); ul.appendChild(li);
    }
    s.sched.appendChild(ul);
  }
  if (res.freqs.length) {
    ul = el('ul', 'tbl'); ul.style.marginTop = '10px';
    for (i = 0; i < res.freqs.length; i++) {
      var f = res.freqs[i];
      li = el('li', 'row arr');
      li.appendChild(el('div', 'badge', f.line));
      body = el('div', 'rbody');
      body.appendChild(el('div', 'rt', 'Every ' + ((f.lo === f.hi || f.hi === undefined) ? f.lo : f.lo + '\u2013' + f.hi) + ' min'));
      body.appendChild(el('div', 'rs', fmtTime(f.from) + ' to ' + fmtTime(f.to)));
      li.appendChild(body); ul.appendChild(li);
    }
    s.sched.appendChild(ul);
  }
}

function loadSched(s) {
  var item = s.item;
  if (item.ttRaw) { showSched(s); return; }
  if (item.schedBusy) { return; }
  if (item.schedFail && new Date().getTime() - item.schedFail < 600000) { schedNote(s, 'No timetable is available for this stop.'); return; }
  item.schedBusy = true;
  schedNote(s, 'Looking up the timetable\u2026');
  ensureLines(item, function () {
    var names = (item.lines || []).slice(0, 8), pending = names.length, got = [];
    var finish = function () {
      item.schedBusy = false;
      if (got.length) { item.ttRaw = got; } else { item.schedFail = new Date().getTime(); }
      if (curScreen() !== s) { return; }
      if (got.length) { showSched(s); } else { schedNote(s, 'No timetable is available for this stop.'); }
    };
    if (!pending) { finish(); return; }
    for (var i = 0; i < names.length; i++) {
      (function (name) {
        getJSON('/Line/' + encodeURIComponent(name.toLowerCase()) + '/Timetable/' + encodeURIComponent(item.id),
          function (tt) { got.push({ line: name, tt: tt }); pending--; if (!pending) { finish(); } },
          function () { pending--; if (!pending) { finish(); } });
      })(names[i]);
    }
  });
}

/* ----- one bus: where it goes next ----- */

function buildBusScreen(s, body) {
  var a = s.arr;
  var hdr = el('div', 'hdr');
  hdr.appendChild(el('h1', 'hname', a.lineName + ' to ' + (a.destinationName || a.towards || '')));
  var reg = String(a.vehicleId || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (reg.length >= 2 && reg.length <= 8) {
    var veh = el('div', 'veh'), fleetEl = el('span', 'vfleet');
    veh.appendChild(fleetEl); veh.appendChild(el('span', 'plate', prettyReg(reg)));
    hdr.appendChild(veh);
    fillVeh(reg, fleetEl);
  }
  body.appendChild(hdr);
  body.appendChild(el('div', 'sec2', 'Next stops'));
  s.note = el('div', 'note', 'Loading predictions\u2026'); body.appendChild(s.note);
  s.list = el('ul', 'tbl'); s.list.style.display = 'none'; body.appendChild(s.list);
  s.upd = el('div', 'upd'); body.appendChild(s.upd);
  endBody(body);
  loadBusStops(s);
  screenTimer = setInterval(function () { loadBusStops(s); }, 20000);
}

function loadBusStops(s) {
  if (curScreen() !== s || document.hidden) { return; }
  getJSON('/Vehicle/' + encodeURIComponent(s.arr.vehicleId) + '/Arrivals',
    function (data) { if (curScreen() === s) { renderBusStops(s, toArray(data)); } },
    function (msg) { if (curScreen() === s) { s.note.style.display = 'block'; s.note.textContent = msg; s.note.className = 'note err'; } });
}

function renderBusStops(s, data) {
  var keep = [], i;
  for (i = 0; i < data.length; i++) { if (data[i] && data[i].timeToStation !== undefined) { keep.push(data[i]); } }
  data = keep;
  data.sort(function (a, b) { return a.timeToStation - b.timeToStation; });
  clearNode(s.list);
  if (!data.length) {
    s.list.style.display = 'none';
    s.note.style.display = 'block'; s.note.className = 'note';
    s.note.textContent = 'No predictions for this bus right now. It may have finished its journey or not started yet.';
  } else {
    s.note.style.display = 'none';
    var now = new Date().getTime(), n = Math.min(data.length, 30);
    for (i = 0; i < n; i++) {
      var d = data[i], mins = Math.floor(d.timeToStation / 60), when = new Date(now + d.timeToStation * 1000);
      var here = s.item && d.naptanId === s.item.id;
      var name = (d.stationName || 'Bus stop') + ((d.platformName && d.platformName !== 'null') ? ' (Stop ' + String(d.platformName).replace(/^stop\s+/i, '') + ')' : '');
      var li = el('li', 'row arr nob' + (here ? ' here' : ''));
      var mid = el('div', 'rbody');
      mid.appendChild(el('div', 'rt', name));
      if (here) { mid.appendChild(el('div', 'rs', 'The stop you are looking at')); }
      li.appendChild(mid);
      var col = el('div', 'mcol');
      col.appendChild(el('div', 'mins', mins < 1 ? 'Due' : mins + ' min'));
      col.appendChild(el('div', 'clock', two(when.getHours()) + ':' + two(when.getMinutes())));
      li.appendChild(col);
      s.list.appendChild(li);
    }
    s.list.style.display = 'block';
  }
  var t = new Date();
  s.upd.textContent = 'Predicted times, updated ' + two(t.getHours()) + ':' + two(t.getMinutes()) + ':' + two(t.getSeconds()) + '.';
}

/* ----- info ----- */

function infoRow(title, sub, fn) {
  var li = el('li', 'row nob' + (fn ? ' go' : ''));
  var b = el('div', 'rbody');
  b.appendChild(el('div', 'rt', title));
  if (sub) { b.appendChild(el('div', 'rs', sub)); }
  li.appendChild(b);
  if (fn) { li.onclick = fn; }
  return li;
}

function buildInfoScreen(s, body) {
  var hdr = el('div', 'hdr');
  hdr.appendChild(el('h1', 'hname', 'ZK\u2019s London Bus Tracker'));
  hdr.appendChild(el('div', 'hsub', 'Live bus times for older iPhones and iPads'));
  body.appendChild(hdr);
  body.appendChild(el('div', 'sec2', 'Actions'));
  var ul = el('ul', 'tbl');
  ul.appendChild(infoRow('Clear recent stops', '', function () { recents = []; saveRecents(); this.getElementsByTagName('div')[1].textContent = 'Cleared'; }));
  ul.appendChild(infoRow('Refresh nearby stops', '', function () { popScreen(); nearbyCache = {}; locate(false); }));
  body.appendChild(ul);
  body.appendChild(el('div', 'sec2', 'Data'));
  var u2 = el('ul', 'tbl');
  u2.appendChild(infoRow('Bus times', 'Transport for London'));
  u2.appendChild(infoRow('Map', '\u00A9 OpenStreetMap contributors'));
  u2.appendChild(infoRow('Fleet numbers', 'bustimes.org'));
  body.appendChild(u2);
  endBody(body);
}

/* ---------- buttons and start ---------- */

q.onfocus = function () { setSearchMode(true); };
q.oninput = function () {
  var v = trimmed(q.value);
  $('clear').style.display = q.value ? 'block' : 'none';
  if (searchTimer) { clearTimeout(searchTimer); }
  searchSeq++;
  if (v.length < 3) { searchState = { q: '', busy: false, items: null, msg: '' }; renderOverlay(); return; }
  searchState = { q: v, busy: true, items: null, msg: '' };
  renderOverlay();
  searchTimer = setTimeout(function () { runSearch(v); }, 600);
};
q.onkeydown = function (e) {
  e = e || window.event;
  if (e.keyCode === 13) {
    var v = trimmed(q.value);
    if (searchTimer) { clearTimeout(searchTimer); }
    if (v.length >= 2) { runSearch(v); }
    q.blur();
  }
};
$('clear').onclick = function () { q.value = ''; $('clear').style.display = 'none'; searchSeq++; searchState = { q: '', busy: false, items: null, msg: '' }; renderOverlay(); q.focus(); };
$('cancel').onclick = function () {
  q.value = ''; q.blur(); searchSeq++;
  searchState = { q: '', busy: false, items: null, msg: '' };
  $('clear').style.display = 'none';
  setSearchMode(false);
};
$('nearBtn').onclick = function () { setSearchMode(true); };
$('locate').onclick = function () { $('areaBtn').style.display = 'none'; if (overlayOn) { $('cancel').onclick(); } locate(false); };
$('infoBtn').onclick = function () { pushScreen({ type: 'info', from: 'map' }); };
$('back').onclick = function () { popScreen(); };
$('mapWarn').onclick = function () { $('mapWarn').style.display = 'none'; };
$('areaBtn').onclick = function () {
  $('areaBtn').style.display = 'none';
  if (!map) { return; }
  stickyNote = '';
  var c = map.getCenter();
  loadNearby(c.lat, c.lng);
};
window.onresize = function () { if (map) { map.invalidateSize(); } };
window.onorientationchange = function () { setTimeout(function () { if (map) { map.invalidateSize(); } }, 300); };
document.addEventListener('visibilitychange', function () { var s = curScreen(); if (!document.hidden && s) { if (s.type === 'stop') { loadStopArrivals(s); } else if (s.type === 'bus') { loadBusStops(s); } } }, false);

initMap();
locate(true);

</script>
</body>
</html>
